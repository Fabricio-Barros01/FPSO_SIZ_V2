# Descritores de apresentação do modo interativo e dos resumos de terminal (F7b).
# Invariante 4: a CLI não nomeia grandeza; ela itera o que está aqui. Nada disto é física:
# só escolhe QUAIS campos já calculados aparecem, com que rótulo e quantas casas.

# Arquivo de casos procurado na pasta corrente quando nenhum é informado.
arquivo_casos_padrao = "design_cases_bot.json"

# Contexto do arquivo de casos: chave do JSON do BOT que cita a fonte dos dados.
[contexto]
origem = "source"

# Tabela de casos do balanço (uma linha por caso do JSON do BOT).
[[casos]]
chave = "num"
rotulo = "#"
casas = 0

[[casos]]
chave = "name"
rotulo = "Caso"

[[casos]]
chave = "fluid_type"
rotulo = "Fluido"

[[casos]]
chave = "T_C"
rotulo = "T (°C)"
casas = 0

[[casos]]
chave = "oil_sm3d"
rotulo = "Óleo (m³/d)"
casas = 0

[[casos]]
chave = "liquid_sm3d"
rotulo = "Líquido (m³/d)"
casas = 0

[[casos]]
chave = "total_gas_sm3d"
rotulo = "Gás total (Sm³/d)"
casas = 0

# Tabela de correntes de um caso: colunas do CSV (config/saida_correntes.toml), por id.
# A descrição vai por último: é texto livre e pode passar da largura do terminal.
[correntes]
chave_caso = "caso"
colunas = [
    { id = "corrente", rotulo = "Corrente" },
    { id = "T_C", rotulo = "T °C", casas = 1 },
    { id = "P_kPa", rotulo = "P kPa", casas = 0 },
    { id = "m_total_kg_s", rotulo = "ṁ kg/s", casas = 2 },
    { id = "Q_O_m3_d", rotulo = "Óleo m³/d", casas = 0 },
    { id = "Q_W_m3_d", rotulo = "Água m³/d", casas = 0 },
    { id = "Q_D_m3_d", rotulo = "Dil. m³/d", casas = 0 },
    { id = "Q_G_Sm3_d", rotulo = "Gás Sm³/d", casas = 0 },
    { id = "nome", rotulo = "Descrição" },
]

# Casos críticos por equipamento (mesmos ids de fpso_siz.balanco.indicadores.criticos),
