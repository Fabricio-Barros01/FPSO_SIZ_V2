# Descritores de apresentação do modo interativo e dos resumos de terminal (F7b, F10c).
# Invariante 4: a CLI não nomeia grandeza; ela itera o que está aqui. Nada disto é física:
# só escolhe QUAIS campos já calculados aparecem, com que rótulo, em que ordem e com
# quantas casas. Menus são listas de ações com id (o código despacha pelo id; o texto e a
# ordem vêm daqui). Rótulos e unidades de parâmetros ficam nos ParameterSpec; fontes, no
# catálogo técnico (config/pfd/).

# Arquivo de casos procurado na pasta corrente quando nenhum é informado.
arquivo_casos_padrao = "design_cases_bot.json"
# Pasta e arquivo de ajustes sugeridos ao exportar.
pasta_padrao = "saida"
pasta_planta = "planta"

# ------------------------------------------------------------------ menus (ordem = tela)
[menus.principal]
titulo = "O que você quer fazer?"
voltar = "Sair"
acoes = [
    { id = "equipamento", rotulo = "Equipamento / TAG" },
    { id = "planta", rotulo = "Planta / PFD — todos os TAGs" },
    { id = "balanco", rotulo = "Balanço de massa e energia" },
    { id = "casos", rotulo = "Casos de projeto" },
    { id = "premissas", rotulo = "Premissas do balanço" },
    { id = "ajustes", rotulo = "Abrir / salvar ajustes" },
]

[menus.preenchimento]
titulo = "Equipamento: {id} · {nome}"
acoes = [
    { id = "automatico", rotulo = "Preenchimento automático — balanço preliminar" },
    { id = "manual", rotulo = "Preenchimento manual" },
    { id = "arquivo", rotulo = "Carregar arquivo de entradas / exemplo" },
]

[menus.tag]
titulo = "{id} — o que fazer?"
acoes = [
    { id = "pendencias", rotulo = "Preencher pendências" },
    { id = "revisar", rotulo = "Revisar recomendações e defaults" },
    { id = "entradas", rotulo = "Ver entradas e fontes de um caso" },
    { id = "editar", rotulo = "Editar entrada" },
    { id = "restaurar", rotulo = "Restaurar entrada automática" },
    { id = "atividade", rotulo = "Atividade dos casos" },
    { id = "rastro", rotulo = "Propriedades e rastro de um caso" },
    { id = "varredura", rotulo = "Varredura do envelope" },
    { id = "exportar", rotulo = "Exportar JSON/CSV e ajustes" },
    { id = "memorial", rotulo = "Gerar memória de cálculo (MC)" },
    { id = "modo", rotulo = "Trocar preenchimento" },
    { id = "associar", rotulo = "Associar a um TAG da planta" },
]

[menus.planta]
titulo = "Planta / PFD"
acoes = [
    { id = "abrir", rotulo = "Abrir um TAG" },
    { id = "pendencias", rotulo = "Preencher pendências" },
    { id = "filtro", rotulo = "Filtrar por caso" },
    { id = "exportar", rotulo = "Exportar" },
    { id = "memoriais", rotulo = "Gerar os memoriais de cálculo (MC) dos TAGs" },
]

[menus.revisar]
titulo = "Revisão"
acoes = [
    { id = "confirmar", rotulo = "Confirmar um item" },
    { id = "confirmar_todos", rotulo = "Confirmar todos os itens mostrados" },
    { id = "editar", rotulo = "Editar o valor de um item" },
]

[menus.escopo]
titulo = "Aplicar a"
acoes = [
    { id = "todos", rotulo = "todos os casos afetados" },
    { id = "escolher", rotulo = "escolher casos" },
]

[menus.balanco]
titulo = "Próximo passo"
acoes = [
    { id = "auditoria", rotulo = "Ver auditoria independente" },
    { id = "correntes", rotulo = "Ver correntes de um caso" },
    { id = "exportar", rotulo = "Exportar" },
    { id = "memorial_caso", rotulo = "Memória de cálculo por caso (MC_CasoNN)" },
]

[menus.casos]
titulo = "Casos"
acoes = [
    { id = "trocar", rotulo = "Trocar arquivo de casos" },
]

[menus.ajustes]
titulo = "Ajustes da sessão"
acoes = [
    { id = "abrir", rotulo = "Abrir arquivo de ajustes" },
    { id = "salvar", rotulo = "Salvar ajustes" },
    { id = "ver", rotulo = "Ver estado dos equipamentos" },
    { id = "descartar", rotulo = "Descartar todos os ajustes" },
]

[menus.reconciliar]
titulo = "Como reconciliar?"
voltar = "Cancelar"
acoes = [
    { id = "adotar_arquivo", rotulo = "Usar as premissas gravadas nos ajustes" },
    { id = "adotar_sessao", rotulo = "Aplicar os ajustes ao contexto atual" },
]

