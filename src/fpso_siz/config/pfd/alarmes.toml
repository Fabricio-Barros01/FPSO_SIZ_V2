# Alarmes de inviabilidade (F13). A unidade do BOT é um projeto básico real: um TAG sem
# equipamento que atenda aos casos não é um resultado de projeto, é um ALARME de possível
# erro — de premissa, numérico ou de modelo — que exige anotação e investigação.
#
# Cada hipótese tem uma classe (premissa | numerico | modelo), a descrição e, quando o
# modelo permite, uma VARIANTE executável pelo mesmo motor (pfd/investigacao.py): o que
# muda na variante é declarado aqui e não altera o cálculo padrão. Uma variante só usa
# valor com origem: fonte citada no código, premissa do balanço ou a faixa declarada pelo
# usuário. Hipótese sem variante fica registrada como investigação pendente.
# Estado da investigação: "aberta" (ninguém decidiu) — a decisão de projeto é do usuário.

classes = { premissa = "premissa", numerico = "numérico", modelo = "modelo" }

[[alarme]]
tag = "P-001"
estado = "fechada pela regra de dimensionamento"
resumo = "FECHADO pela ADR 0005 (docs/validacao/43): a geometria é dimensionada pelo caso de PROJETO, com a carga do balanço preliminar, e CLASSIFICADA (rating) nos demais; o que a área instalada não recupera num caso é compensado pelas utilidades (P-002 e P-003 pelas cargas residuais). Com as mesmas correlações (película do lado tubo nos três regimes, Branan pp. 40-41) e os mesmos limites, o TAG é dimensionado nos dez casos ativos: um passe (contracorrente, F = 1), quatro trens em paralelo e oito cascos em série de 6 m por trem."
hipoteses = [
    { classe = "modelo", texto = "RESOLVIDA (docs/validacao/24): faltava correlação do lado tubo fora da faixa de Dittus-Boelter; a fonte existia (Branan pp. 40-41) e está implementada, com caso-ouro independente." },
    { classe = "premissa", texto = "RESOLVIDA (ADR 0005): exigir de uma única geometria a carga inteira de TODOS os casos era DESIGN aplicado como off-design. O caso de projeto dimensiona; os demais são classificados, e a diferença é das utilidades." },
]

[[alarme]]
tag = "P-002"
estado = "fechada pela física"
resumo = "FECHADO em 2026-09-26, sem premissa nova e sem mudar arquitetura. O único bloqueio era a faixa de Dittus-Boelter no caso de menor carga (BOT 06, 3,6 % da carga de projeto), e ele existia porque o programa não tinha correlação fora do turbulento. Com os três regimes (Branan pp. 40-41) o BOT 06 passa a ser calculado e o TAG fica VIÁVEL: na geometria que a reotimização escolhe ele cai no LAMINAR (Re = 1.416, Hausen), e quem cai na interpolação de transição são os BOT 04 (Re = 4.145) e BOT 05 (Re = 5.461). A reotimização reexecutada com a física correta escolhe UM CASCO: tubo de 12,7 mm, 1 passe, passo 1,25, arranjo 90°, chicana 0,2·Ds, 1.605 tubos/passe, L = 5,99 m, 383,8 m² — 21 dos 96 candidatos da grade são viáveis. Nem cascos em série nem circulação fixa foram necessários."
hipoteses = [
    { classe = "premissa", texto = "CONFIRMADA e adotada (P-46): a alocação com o óleo viscoso no tubo foi trocada; com a água nos tubos, só o turndown profundo saía da faixa turbulenta." },
    { classe = "modelo", texto = "RESOLVIDA: a correlação do lado tubo fora do turbulento existia no acervo e está implementada (Hausen eq. 2-10, interpolação eq. 2-12), com caso-ouro independente. Era o que faltava — não uma premissa de operação." },
    { classe = "premissa", texto = "Vazão da utilidade proporcional à carga (ṁ = q/(cp·ΔT), com o ΔT fixo pelos insumos): com a física completa ela NÃO precisa mais ser revista para o TAG ter solução. A circulação fixa continua estudo em docs/validacao/21-circulacao-cascos.md, e agora é escolha de operação, não remédio de viabilidade." },
]

[[alarme]]
tag = "P-003"
estado = "fechada pela física"
resumo = "FECHADO em 2026-09-26, junto com o P-002 e pelo mesmo motivo. Os casos de baixa carga (BOT 04, BOT 05 e BOT 06) eram recusados por falta de correlação, não por limite físico: na geometria escolhida os três ficam no LAMINAR (Re = 1.449, 629 e 162; Hausen), e a interpolação de transição aparece nos BOT 11, 15 e 16 (Re = 6.111, 4.615 e 5.139). Com os três regimes eles calculam, e a reotimização reexecutada encontra UM CASCO viável: tubo de 12,7 mm, 1 passe, passo 1,25, arranjo 30°, chicana 0,2·Ds, 7.526 tubos/passe, L = 4,91 m, 1.473,4 m² — 32 dos 96 candidatos são viáveis. O bloqueio de comprimento que restava com tubo de 25,4 mm (7,33 m contra o limite de 6 m) desaparece com o tubo menor, que acomoda mais tubos no mesmo casco. NÃO foi preciso estender a série de cascos ao P-003, nem fixar a circulação: a premissa original (série só no P-002) segue intacta e o P-002 também não precisa mais dela."
hipoteses = [
    { classe = "premissa", texto = "CONFIRMADA e adotada (P-46): a alocação com o óleo viscoso no tubo foi trocada." },
    { classe = "modelo", texto = "RESOLVIDA: os casos de baixa carga eram recusados por falta de correlação. Implementados os três regimes, com caso-ouro independente, nenhum caso ativo é mais recusado por correlação." },
    { classe = "modelo", texto = "RESOLVIDA sem mudar arquitetura: o comprimento excedia o limite de estoque de 6 m com tubo de 25,4 mm; com 12,7 mm o melhor feixe cabe em 4,91 m num casco só. Os limites de 6 m e de 2.500 mm não foram alterados, e cascos em série/paralelo não foram acionados." },
    { classe = "premissa", texto = "Vazão da utilidade proporcional à carga: não é mais necessária para o TAG ter solução. A circulação fixa segue como estudo, e a decisão é de operação." },
]

[[alarme]]
tag = "B-001"
estado = "explicada"
resumo = "Só sem a P-44 (banda em todos os casos): cada caso tem DN admissível isolado (125 a 600 mm), mas as faixas não se cruzam, porque a vazão de óleo varia cerca de 23× entre os casos. Com a P-44 (padrão) a linha é dimensionada pelo caso de maior vazão: DN 600 (docs/validacao/17-banda-bombas.md)."
hipoteses = [
    { classe = "premissa", texto = "CONFIRMADA (P-44): piso de velocidade de 1 m/s aplicado ao óleo tratado. Pela nota do descritor v_min (Moran 2016), o piso é para líquido com sólidos decantáveis; para líquido limpo o artigo só impõe o teto.", variantes = ["vmin_0"] },
    { classe = "premissa", texto = "CONFIRMADA (P-44): o envelope exigia a banda de velocidade em TODOS os casos de uma única linha. No projeto, a linha é dimensionada pelo caso de maior vazão, e os casos de menor vazão operam com velocidade menor (turndown)." },
    { classe = "modelo", texto = "No turndown (caso 6, 4 % da vazão de projeto) a linha DN 600 fica na zona de transição laminar-turbulento (Re ≈ 3.460), onde nenhuma correlação de atrito da implementação vale. P-44b: o caso é fechado por POLÍTICA conservadora de engenharia (f de Colebrook-White aceito se não for menor que 64/Re), separada das correlações válidas; não é limite superior demonstrado. A confirmar." },
    { classe = "modelo", texto = "Uma bomba só não opera numa faixa de 23×: a vazão mínima contínua é dado do fabricante (fora do acervo). Bombas em paralelo ou recirculação de mínimo fluxo não são modeladas; a especificação sai do caso de projeto." },
]

[[alarme]]
tag = "B-002"
estado = "explicada"
resumo = "Só sem a P-44: nos casos 15 e 16 a banda de 1,0–1,5 m/s cai no vão da série, entre DN 150 (≈1,7 m/s) e DN 200 (≈1,0 m/s), e nos demais a vazão varia cerca de 10×. Com a P-44 (padrão), a linha é dimensionada pelo caso de maior vazão (caso 11): DN 250."
hipoteses = [
    { classe = "premissa", texto = "Banda de velocidade 1–1,5 m/s (Moran 2016) mais estreita que o salto de área entre DN consecutivos da série (200/150 → 1,78×): há vazões sem DN na banda. É numérico só na aparência: vem da combinação banda × série. Com a P-44 a banda só vale no caso de projeto, e ele tem DN na banda." },
    { classe = "premissa", texto = "CONFIRMADA (P-44): banda aplicada a todos os casos de uma única linha, como no B-001. O piso é mantido no caso de projeto (água produzida pode levar sólidos decantáveis)." },
]

[[alarme]]
tag = "B-003"
estado = "explicada"
resumo = "Só sem a P-44: cada caso tem DN admissível isolado (40 a 125 mm), mas as faixas não se cruzam, porque a vazão de água varia cerca de 8× entre os casos. Com a P-44 (padrão): DN 125, pelo caso 3."
hipoteses = [
    { classe = "premissa", texto = "CONFIRMADA (P-44): banda de velocidade aplicada a todos os casos de uma única linha (turndown), como no B-001." },
]

# ------------------------------------------------------------------ variantes
# `premissas`: alterações de premissa do balanço (nome = valor); `geral`: entrada do TAG em
# todos os casos; `fator_vazao`: divide as vazões do TAG (trens em paralelo). `origem` diz de
# onde vem cada valor usado.

[variantes.vmin_0]
rotulo = "sem piso de velocidade (líquido limpo)"
geral = { v_min = 0.0 }
origem = "nota do descritor v_min em equipment/pump/moran.toml (Moran 2016: piso só para líquido com sólidos decantáveis)"

[variantes.sem_p44]
rotulo = "banda de velocidade em todos os casos (sem a P-44; regra do Julia)"
geral = { piso_caso_projeto = 0.0, transicao_turndown = 0.0, v_min = 1.0 }
origem = "defaults do método de Moran (2016) e regra do Julia: estudo do estado anterior à P-44"
