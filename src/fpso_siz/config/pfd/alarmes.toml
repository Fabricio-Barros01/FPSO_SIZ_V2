# Alarmes de inviabilidade (F13). A unidade do BOT é um projeto básico real: um TAG sem
# equipamento que atenda aos casos não é um resultado de projeto, é um ALARME de possível
# erro — de premissa, numérico ou de modelo — que exige anotação e investigação.
#
# Cada hipótese tem uma classe (premissa | numerico | modelo), a descrição e, quando o
# modelo permite, uma VARIANTE executável pelo mesmo motor (pfd/investigacao.py): o que
# muda na variante é declarado aqui e não altera o cálculo padrão. Uma variante só usa
# valor com origem: fonte citada no código, premissa do balanço ou a faixa declarada pelo
# usuário. Hipótese sem variante fica registrada como investigação pendente.
# Estado da investigação: "aberta" (ninguém decidiu) — a decisão de projeto é do usuário.

classes = { premissa = "premissa", numerico = "numérico", modelo = "modelo" }

[[alarme]]
tag = "SG-001"
estado = "explicada"
resumo = "Só no modo --oleo-morto: os casos 2 e 3 (Early Life, com água) são inviáveis isolados, porque o teto de decantação (água em óleo) fica abaixo do menor diâmetro com a esbeltez na banda. Com a viscosidade de óleo vivo (padrão) o vaso é viável (docs/validacao/16-oleo-vivo.md)."
hipoteses = [
    { classe = "premissa", texto = "CONFIRMADA: a viscosidade de óleo MORTO (BOT Tab. 2.2.1.2, P-40) usada para o óleo vivo do FWKO. O gás dissolvido na saída de óleo (Rs de C-06) reduz µ_o cerca de 40 % pela correlação de Beggs & Robinson (1975), e (h_o)max ∝ 1/µ_o: o teto dos casos 2 e 3 sobe e o vaso passa a ter solução. A correlação está fora do acervo local (a conferir) e não substitui um PVT medido." },
    { classe = "premissa", texto = "Critério de decantação de gotículas de água de 500 µm no óleo (S&A §4.7.2) aplicado ao FWKO, cuja saída de óleo pode levar até o BSW de F-06 (BOT 2.7.1.2): o FWKO remove água livre, não especifica o óleo. O critério pode ser mais restritivo que a função do vaso." },
    { classe = "premissa", texto = "Eficiência de água livre P-43 (premissa do autor, faixa de 80–90 % declarada pelo usuário): muda o reciclo quente e a temperatura de entrada do FWKO, logo µ_o e o teto.", variantes = ["eta_80", "eta_90"] },
    { classe = "modelo", texto = "Um único vaso para todos os casos: com trens em paralelo a vazão por vaso cai e o comprimento exigido também; o teto (razão de vazões, µ, ΔSG) não muda.", variantes = ["trens_2", "trens_3"] },
    { classe = "numerico", texto = "Conferência numérica: (h_o)max, β e d_max refeitos à mão com os operandos do rastro reproduzem o resultado (teste da conta à mão); β por bisseção idêntico ao Julia." },
]

[[alarme]]
tag = "P-001"
estado = "aberta"
resumo = "Óleo/óleo. A LACUNA METODOLÓGICA FOI FECHADA: a película do lado tubo passou a ter correlação nos três regimes (Hausen em Re ≤ 2000, interpolação em 2000 < Re < 10⁴, Dittus-Boelter acima — Branan pp. 40-41), e todos os dez casos ativos agora CALCULAM. O que restou é físico e construtivo, não metodológico: com 2 passes o fator F do arranjo 1-2 sai do domínio da Fig. 4.3 (cruzamento interno); com 1 passe (contracorrente) o impedimento é a ÁREA. No platô laminar o h_i do óleo satura em cerca de 34 W/(m²·K) e o U em cerca de 25 W/(m²·K), contra um U·A exigido de 1,55 MW/K no caso de projeto: o feixe mais curto de toda a grade pede 186,4 m de tubo (o escolhido, 434,4 m) contra o limite de 6 m. No topo da banda de velocidade (3 m/s, teto de erosão de Saari) o óleo ainda está em transição, com U de cerca de 388 W/(m²·K) e área de cerca de 4.000 m². Nenhuma correlação resolve isto: é a troca óleo/óleo com aproximação de 10 K (P-32) que exige essa área. Ver docs/validacao/24-pelicula-baixo-reynolds.md."
hipoteses = [
    { classe = "premissa", texto = "Arranjo de 2 passes no tubo (default 'escolha' de Saari Tab. 3.1): com a aproximação de P-32 a troca óleo/óleo é quase simétrica (R ≈ 1) e P alto, fora do alcance de um casco 1-2. Contracorrente pura (1 passe) resolve o domínio de F — e aí o impedimento passa a ser a área.", variantes = ["passes_1"] },
    { classe = "modelo", texto = "RESOLVIDA: faltava correlação do lado tubo fora da faixa de Dittus-Boelter. A fonte existia (Branan pp. 40-41) e está implementada e validada (caso-ouro independente em tests/fixtures/python_ref/golden_pelicula_tubo.json). Os dez casos calculam; o alarme deixou de ser metodológico." },
    { classe = "premissa", texto = "A área exigida vem da APROXIMAÇÃO de 10 K da P-32 entre duas correntes de óleo. O teto de velocidade de 3 m/s (erosão, Saari Tab. 3.1) impede o óleo de chegar ao turbulento: a 3 m/s o Reynolds é de cerca de 7.000. Aumentar o ΔT de aproximação reduz a recuperação do pré-aquecedor e a área na mesma direção — é decisão de projeto, com efeito no balanço, e não foi tomada aqui." },
    { classe = "modelo", texto = "No platô laminar o Nusselt é constante (3,66 mais o termo de entrada), então acrescentar tubos reduz o comprimento sem piorar o coeficiente: de 1.994 tubos/passe (piso de 1 m/s) a 50.000 tubos/passe o comprimento exigido cai de 266 m para 21 m, e a área fica em cerca de 60.000 m². Ou seja: nem relaxando o piso de velocidade o equipamento cabe no limite de 6 m — o impedimento é a área, não a banda.", variantes = ["p_001_emulsao_casco"] },
]

[[alarme]]
tag = "P-002"
estado = "fechada pela física"
resumo = "FECHADO em 2026-09-26, sem premissa nova e sem mudar arquitetura. O único bloqueio era a faixa de Dittus-Boelter no caso de menor carga (BOT 06, 3,6 % da carga de projeto), e ele existia porque o programa não tinha correlação fora do turbulento. Com os três regimes (Branan pp. 40-41) o BOT 06 passa a ser calculado na transição e o TAG fica VIÁVEL. A reotimização reexecutada com a física correta escolhe UM CASCO: tubo de 12,7 mm, 1 passe, passo 1,25, arranjo 90°, chicana 0,2·Ds, 1.605 tubos/passe, L = 5,99 m, 383,8 m² — 21 dos 96 candidatos da grade são viáveis. Nem cascos em série nem circulação fixa foram necessários."
hipoteses = [
    { classe = "premissa", texto = "CONFIRMADA e adotada (P-46): a alocação com o óleo viscoso no tubo foi trocada; com a água nos tubos, só o turndown profundo saía da faixa turbulenta." },
    { classe = "modelo", texto = "RESOLVIDA: a correlação do lado tubo fora do turbulento existia no acervo e está implementada (Hausen eq. 2-10, interpolação eq. 2-12), com caso-ouro independente. Era o que faltava — não uma premissa de operação." },
    { classe = "premissa", texto = "Vazão da utilidade proporcional à carga (ṁ = q/(cp·ΔT), com o ΔT fixo pelos insumos): com a física completa ela NÃO precisa mais ser revista para o TAG ter solução. A circulação fixa continua estudo em docs/validacao/21-circulacao-cascos.md, e agora é escolha de operação, não remédio de viabilidade.", variantes = ["p_002_circulacao_fixa"] },
]

