# ------------------------------------------------------------------ variantes
# `premissas`: alterações de premissa do balanço (nome = valor); `geral`: entrada do TAG em
# todos os casos; `fator_vazao`: divide as vazões do TAG (trens em paralelo). `origem` diz de
# onde vem cada valor usado.
[variantes.eta_80]
rotulo = "η_padrão = 0,80 (P-43)"
premissas = { eta_F = 0.80 }
origem = "limite inferior da faixa de 80–90 % declarada pelo usuário para a P-43 (F10w)"

[variantes.eta_90]
rotulo = "η_padrão = 0,90 (P-43)"
premissas = { eta_F = 0.90 }
origem = "limite superior da faixa de 80–90 % declarada pelo usuário para a P-43 (F10w)"

[variantes.trens_2]
rotulo = "2 trens em paralelo (2 × 50 %)"
fator_vazao = 2
chaves_vazao = ["q_oil", "q_water", "q_gas"]
origem = "divisão da vazão por um número inteiro de vasos iguais; não há valor suposto"

[variantes.trens_3]
rotulo = "3 trens em paralelo (3 × 33 %)"
fator_vazao = 3
chaves_vazao = ["q_oil", "q_water", "q_gas"]
origem = "divisão da vazão por um número inteiro de vasos iguais; não há valor suposto"

[variantes.passes_1]
rotulo = "1 passe no tubo (contracorrente pura)"
geral = { passes_tubo = 1.0 }
origem = "limite inferior do descritor passes_tubo (Saari §4.2.1: contracorrente puro, F = 1), sugerido pela própria mensagem do motor"

[variantes.vmin_0]
rotulo = "sem piso de velocidade (líquido limpo)"
geral = { v_min = 0.0 }
origem = "nota do descritor v_min em equipment/pump/moran.toml (Moran 2016: piso só para líquido com sólidos decantáveis)"

[variantes.sem_p44]
rotulo = "banda de velocidade em todos os casos (sem a P-44; regra do Julia)"
geral = { piso_caso_projeto = 0.0, transicao_turndown = 0.0, v_min = 1.0 }
origem = "defaults do método de Moran (2016) e regra do Julia: estudo do estado anterior à P-44"

# Topologias alternativas (config/pfd/variantes/): outra alocação das correntes no mesmo
# trocador. Os valores de `geral` são os PROPOSTOS do próprio TAG (pendencias_propostas.toml)
# trocados de lado junto com os fluidos: k do óleo 0,13 W/m·K e incrustação do óleo 0,00035
# m²K/W no casco; incrustação da água de utilidade 0,00018 m²K/W nos tubos.
[variantes.p_001_emulsao_casco]
rotulo = "emulsão fria no casco, óleo tratado quente nos tubos"
topologia = "p_001_emulsao_casco"
origem = "prática de alocar o fluido mais viscoso no casco (hipótese do alarme); k e incrustações do P-001 são as mesmas propostas nos dois lados"

# Circulação fixa da utilidade (F13/Etapa 2) — ESTUDO autorizado pelo usuário em 2026-09-26.
# O cálculo padrão continua com ṁ = q/(cp·ΔT) e o ΔT fixo pelos insumos. Aqui a vazão é a do
# caso de projeto (P-45) em todos os casos, e a temperatura de saída de cada caso é RESOLVIDA
# por bisseção sobre o mesmo fechamento de energia (pfd/circulacao.py; critérios numéricos em
# config/pfd/circulacao.toml). `circulacao_fixa` declara de quais entradas do TAG o estudo lê e
# qual insumo recebe a saída resolvida — nenhum nome de parâmetro está no código do estudo.
[variantes.p_002_circulacao_fixa]
rotulo = "circulação fixa da utilidade (vazão do caso de projeto em todos os casos)"
circulacao_fixa = { vazao = "m_tubo", densidade = "rho_tubo", cp = "cp_tubo", entrada = "t_agua_in", saida = "t_agua_out" }
origem = "hipótese de operação declarada pelo usuário (2026-09-26) como estudo: a bomba da utilidade mantém a vazão do caso de projeto (P-45) e o ΔT varia com a carga; a vazão vem do próprio caso de projeto e a temperatura de saída é resolvida, não suposta"

[variantes.p_003_circulacao_fixa]
rotulo = "circulação fixa da utilidade (vazão do caso de projeto em todos os casos)"
circulacao_fixa = { vazao = "m_tubo", densidade = "rho_tubo", cp = "cp_tubo", entrada = "t_agua_in", saida = "t_agua_out" }
origem = "hipótese de operação declarada pelo usuário (2026-09-26) como estudo: a bomba da utilidade mantém a vazão do caso de projeto (P-45) e o ΔT varia com a carga; a vazão vem do próprio caso de projeto e a temperatura de saída é resolvida, não suposta"
