# ESTUDO de alarme (F13), não entra na planta: P-001 (óleo/óleo) com a emulsão fria do FWKO
# (C-06 → C-07, o fluido mais viscoso) no CASCO e o óleo tratado quente (C-22 → C-23) nos
# TUBOS: o inverso da convenção do PFD F1 do Julia (tags/p_001.toml). Bell-Delaware cobre o
# laminar no casco (Jr); o óleo quente, menos viscoso, vai nos tubos.
tag = "P-001"
nome = "Pré-aquecedor óleo/óleo (estudo: emulsão no casco)"
equipamento = "exchanger"
metodo = "saari_lmtd"
bloco = "P-001"

[entradas]
m_tubo = { regra = "vazao_massica", corrente = "C-22" }
cp_tubo = { regra = "cp_corrente", corrente = "C-22" }
t_tubo_in = { regra = "temperatura", corrente = "C-22" }
t_tubo_out = { regra = "temperatura", corrente = "C-23" }
rho_tubo = { regra = "densidade_fase", corrente = "C-22", fase = "liquido", t = ["C-22", "C-23"] }
mu_tubo = { regra = "viscosidade_fase", corrente = "C-22", fase = "liquido", continua = "oleo", t = ["C-22", "C-23"] }
m_casco = { regra = "vazao_massica", corrente = "C-06" }
cp_casco = { regra = "cp_corrente", corrente = "C-06" }
t_casco_in = { regra = "temperatura", corrente = "C-06" }
mu_casco = { regra = "viscosidade_fase", corrente = "C-06", fase = "liquido", continua = "oleo", t = ["C-06", "C-07"] }

[inativo_se]
carga_nula = "Q_pre"
