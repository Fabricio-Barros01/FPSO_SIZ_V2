# ESTUDO de alarme (F13), não entra na planta: P-003 com o óleo no CASCO e a água de resfriamento
# de utilidade nos TUBOS. Hipótese de premissa do alarme do P-003 (config/pfd/alarmes.toml):
# o fluido mais viscoso vai no casco, onde Bell-Delaware cobre o escoamento laminar (fator
# Jr, Branan Eq. 2-29), e a água, nos tubos, fica turbulenta (Dittus-Boelter). Mesmas
# correntes, cargas e utilidade do tags/p_003.toml; só a alocação muda.
tag = "P-003"
nome = "Resfriador de óleo (estudo: óleo no casco)"
equipamento = "exchanger"
metodo = "saari_lmtd"
bloco = "P-003"

[entradas]
m_tubo = { regra = "vazao_utilidade", carga = "Q_C", entrada = "t_agua_in", saida = "t_agua_out", processo = ["C-23", "C-24"] }
cp_tubo = { regra = "cp_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
t_tubo_in = { regra = "insumo", chave = "t_agua_in" }
t_tubo_out = { regra = "insumo", chave = "t_agua_out" }
rho_tubo = { regra = "densidade_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
mu_tubo = { regra = "viscosidade_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
k_tubo = { regra = "condutividade_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
m_casco = { regra = "vazao_massica", corrente = "C-23" }
cp_casco = { regra = "cp_corrente", corrente = "C-23" }
t_casco_in = { regra = "temperatura", corrente = "C-23" }
mu_casco = { regra = "viscosidade_fase", corrente = "C-23", fase = "liquido", continua = "oleo", t = ["C-23", "C-24"] }

[insumos.t_agua_in]
rotulo = "Temperatura de entrada da água de resfriamento (meio de resfriamento)"
unidade = "°C"
dica = "Temperatura de suprimento da utilidade: dado do sistema de utilidades, sem fonte no acervo."

[insumos.t_agua_out]
rotulo = "Temperatura de saída da água de resfriamento (meio de resfriamento)"
unidade = "°C"
dica = "Temperatura de retorno da utilidade."

[inativo_se]
carga_nula = "Q_C"
