# Fase 3 — SERVIÇO TERMODINÂMICO ATIVO: o contrato que o processo pode consumir.
#
# A F14 (pfd/termodinamica.py) é COMPARATIVA: ela mede o quanto o balanço preliminar se afasta
# de propriedades de fonte citável, sem mudar nada. Este serviço é a camada que o processo
# poderá CHAMAR — flash_tp(T, P, z, fluido) → EstadoTermodinamico.
#
# Nesta fase ele é apenas DISPONIBILIZADO. Nada do balanço, do dimensionamento ou dos relatórios
# passa por ele ainda: integrar é a Fase 5, e a fração pesada (surrogate n-C40/n-C33) é a Fase 4.
#
# O que declara backend, componentes, EOS e fontes continua sendo `fluidos.toml`; aqui só se
# declara o que é do SERVIÇO — unidades, base de composição, critérios numéricos e quais fluidos
# ele atende, com a lacuna de cada um. Nenhum número de engenharia novo.

[servico]
# O serviço fala SI, como a porta `pfd/_chedl.py`. A conversão para as unidades do projeto
# (°C, kPa, cP) é de quem consome — hoje `pfd/fluidos.py`.
unidades = "T [K], P [Pa], rho [kg/m³], h [J/kg], cp [J/(kg·K)], mu [Pa·s], k [W/(m·K)], MW [g/mol]"
# Critério NUMÉRICO de entrada, não premissa física: o quanto a soma das frações pode se afastar
# de 1 antes de a composição ser recusada. O serviço NÃO normaliza em silêncio — normalizar
# esconderia erro de quem chama.
tolerancia_composicao = 1.0e-9
fonte_tolerancia = "critério de validação de entrada do serviço; não é grandeza física"

# ---------------------------------------------------------------------------- fluidos atendidos
# `modelo` e `fonte` dizem que física responde por cada um. `base_composicao` diz o que `z`
# significa — e elas NÃO são a mesma para todos, por isso é campo declarado.

[fluido.hidrocarboneto]
rotulo = "hidrocarboneto (VLE por equação de estado)"
modelo = "peng_robinson"
base_composicao = "fracao_molar"
# componentes, EOS e kij vêm de fluidos.toml [gas]: é a MESMA declaração que o PFD já usa, e
# duplicá-la aqui criaria duas verdades.
declaracao = "fluidos.toml [gas]"
fases = ["vapor", "liquido"]
# thermo conta entalpia a partir do gás ideal a 298,15 K, SEM entalpia de formação. Só
# DIFERENÇAS de entalpia do mesmo fluido têm significado; h de fluidos diferentes não se compara.
referencia_entalpia = "gás ideal a 298,15 K, sem entalpia de formação (convenção do thermo)"
fonte = "Peng & Robinson, Ind. Eng. Chem. Fundam. 15 (1976) 59-64; kij do banco ChemSep (thermo.interaction_parameters.IPDB)"

[fluido.agua]
rotulo = "água pura / utilidade (IAPWS-95)"
modelo = "iapws95"
base_composicao = "fracao_molar"
declaracao = "fluidos.toml [agua]"
fases = ["liquido"]
referencia_entalpia = "convenção IAPWS-95: u = s = 0 no líquido saturado do ponto triplo"
fonte = "IAPWS-95: Wagner & Pruß, J. Phys. Chem. Ref. Data 31 (2002) 387-535; mu IAPWS 2008; k IAPWS 2011"

[fluido.salmoura]
rotulo = "água produzida / salmoura (Laliberté 2009)"
modelo = "laliberte"
# ATENÇÃO: a base aqui é MÁSSICA e o componente é o sal — não é a mesma base do hidrocarboneto.
base_composicao = "fracao_massica_de_sal"
declaracao = "fluidos.toml [salmoura]"
fases = ["aquosa"]
referencia_entalpia = "não aplicável: o modelo de Laliberté dá cp, não entalpia"
fonte = "Laliberté, M. J. Chem. Eng. Data 54 (2009) 1725-1760, via thermo.electrochem"

# ---------------------------------------------------------------------------- lacunas declaradas
# O que o serviço NÃO entrega, e por quê. Cada uma é entrada que falta, nunca número suposto.

[[lacuna]]
fluido = "hidrocarboneto"
grandeza = "fluido de poço completo (com a fração pesada C20+/C20++)"
motivo = "o BOT dá só MW e densidade do C20+; Tc, Pc e ω exigiriam o ponto de ebulição normal. O serviço flasheia a composição que tem caracterização (o corte N2–nC4 do balanço), e recusa a fração pesada"
quando = "Fase 4: surrogate n-C40 / n-C33 por proximidade de MW"

[[lacuna]]
fluido = "hidrocarboneto"
grandeza = "condutividade térmica da fase líquida"
motivo = "o backend a estima por DIPPR_9H sobre ajustes REFPROP_FIT dos puros; numa sondagem a 250 K a mistura leve deu 2,5e-4 W/(m·K), valor fora do que se espera de hidrocarboneto líquido (~0,1). É extrapolação dos ajustes para muito abaixo da faixa dos componentes leves"
quando = "validar antes de a Fase 5 consumir k da fase líquida; o serviço entrega o valor do backend COM o método na mão, e avisa"

[[lacuna]]
fluido = "salmoura"
grandeza = "condutividade térmica"
motivo = "o banco de Magomedov (thermo.electrochem) não tem NaCl"
quando = "sem previsão; hoje k da fase aquosa é entrada proposta"

[[lacuna]]
fluido = "salmoura"
grandeza = "entalpia"
motivo = "Laliberté (2009) correlaciona rho, mu e cp; não há entalpia no modelo"
quando = "sem previsão; diferenças de entalpia da fase aquosa podem ser obtidas do cp"

[fluido.poco]
rotulo = "fluido de poço completo (reais + pseudo-componentes SCN e plus)"
modelo = "peng_robinson_pseudo"
base_composicao = "fracao_molar"
declaracao = "fluidos.toml [gas] para os reais; pfd/caracterizacao_scn.toml para os pseudo"
fases = ["vapor", "liquido"]
referencia_entalpia = "não aplicável: sem Cp_ig dos pseudo-componentes, h e cp não são calculados (bloqueio declarado em caracterizacao_scn.toml)"
fonte = "Peng-Robinson (Peng & Robinson, 1976) sobre caracterização de Riazi & Al-Sahhaf, Fluid Phase Equilibria 117 (1996) 217-224"
