# Fase 5 — integração do serviço termodinâmico ao processo, com ATIVAÇÃO SELETIVA.
#
# Este arquivo é o MAPA DE PROVENIÊNCIA: para cada propriedade, de onde ela vem hoje, de onde
# poderia passar a vir, quem a consome, e se está liberada. Nada é substituído sem constar aqui.
#
# Regra que governa o arquivo (invariante 5 do CLAUDE.md): backend devolver número não é o
# mesmo que propriedade validada para engenharia. `status` é a classificação declarada:
#   liberada  — validada, pode ser consumida pelo processo
#   sombra    — calculada e registrada em paralelo, NÃO consumida
#   bloqueada — não pode ser consumida; se alguém tentar, o guarda levanta erro
#
# O estado que o processo usa é HÍBRIDO por construção nesta fase, e isso é declarado: parte
# das propriedades vem do caminho legado e parte poderia vir do flash. Nenhum resumo deve
# apresentar o conjunto como produzido por um modelo termodinâmico único.

[fase]
modo = "sombra"
nota = "o flash roda em paralelo nos pontos de equilíbrio e é comparado; o processo continua consumindo o caminho legado. Trocar uma propriedade de origem exige mudar o `status` dela aqui e registrar o efeito na tabela antigo × novo."

# ---------------------------------------------------------------------------- pontos de equilíbrio
# Onde o flash deveria ser usado. T e P saem do próprio balanço, corrente a corrente.

[[ponto]]
id = "SG-001"
corrente_gas = "C-04"
pressao = "P_FWKO"
descricao = "separador de água livre: primeira liberação de gás"
legado = "ΔRs de Standing entre (P_FWKO, T03) e a condição padrão, multiplicado pela vazão de óleo"

[[ponto]]
id = "V-001"
corrente_gas = "C-09"
pressao = "P_D1"
descricao = "primeiro desgaseificador"
legado = "ΔRs de Standing entre (P_D1, T_D1) e a condição padrão"

[[ponto]]
id = "V-002"
corrente_gas = "C-17"
pressao = "P_D2"
descricao = "segundo desgaseificador"
legado = "derivado do mesmo ΔRs do V-001 (regra do script de referência)"

# ---------------------------------------------------------------------------- mapa de proveniência
# propriedade | origem atual | origem proposta | consumidores | status

[[propriedade]]
id = "beta"
rotulo = "fração de fase (vapor/líquido)"
origem_atual = "não existe como fração: o gás liberado sai de ΔRs de Standing × vazão de óleo (P-39/P-40)"
origem_proposta = "flash_tp(fluido='poco'): fração molar e mássica de vapor"
consumidores = ["balanco/modelo.py: vazão de gás de C-04, C-09 e C-17", "todas as correntes a jusante", "cargas térmicas (via vazões)", "dimensionamento de todos os TAGs"]
status = "sombra"
motivo = "substituir muda a vazão de gás de todos os estágios e, por ela, o balanço de energia — que a Fase 5 não pode ativar (item 9). Fica medido e comparado."

[[propriedade]]
id = "y"
rotulo = "composição da fase vapor"
origem_atual = "corte N2–nC4 da composição de alimentação, renormalizado e CONSTANTE em toda a planta (P-03)"
origem_proposta = "flash_tp: composição da fase vapor em cada estágio, que muda de estágio para estágio"
consumidores = ["pfd/fluidos.gas → Z, μ, k do gás", "balanco/propriedades.gas_props → MW, cp, γ, ρ_std", "balanco/indicadores → CO2 e H2S molares", "entradas do PFD: capacidade de gás dos vasos"]
status = "sombra"
motivo = "é a diferença física mais visível: hoje o gás tem a mesma composição no FWKO e no segundo desgaseificador, o que o equilíbrio contradiz. Trocar altera Z, ρ_g e o dimensionamento por capacidade de gás."

[[propriedade]]
id = "x"
rotulo = "composição da fase líquida"
origem_atual = "não existe: o líquido é tratado por pseudo-componentes O/W/D/G com propriedades fixas"
origem_proposta = "flash_tp: composição da fase líquida"
consumidores = ["nenhum hoje"]
status = "sombra"
motivo = "não há consumidor no caminho atual; é entrada para a fase que reformular o líquido."

[[propriedade]]
id = "Z"
rotulo = "fator de compressibilidade do gás"
origem_atual = "balanço: Z = 1 (gás ideal, P-39). PFD: Z pela EOS de Peng-Robinson sobre a composição FIXA (pfd/fluidos.gas)"
origem_proposta = "flash_tp: Z da fase vapor com a composição de equilíbrio do estágio"
consumidores = ["pfd/fluidos.gas → ρ_g = P·MW/(Z·R·T)", "capacidade de gás dos vasos (SG-001, V-001, V-002)"]
status = "liberada"
motivo = "propriedade validada: PR é adequada para fase vapor, e o serviço já reproduz bit a bit o Z do caminho atual quando recebe a mesma composição (há teste na F3)."

[[propriedade]]
id = "MW"
rotulo = "massa molar das fases"
origem_atual = "MW do corte leve, constante (balanco/propriedades.gas_props)"
origem_proposta = "flash_tp: MW de cada fase, dentro da caracterização adotada"
consumidores = ["ρ_std do gás", "densidade relativa γ (Standing)", "indicadores molares", "ρ_g no PFD"]
status = "liberada"
motivo = "liberada DENTRO DA CARACTERIZAÇÃO ADOTADA: fecha em relação aos MW das entradas e da caracterização, não é o MW verdadeiro do corte real."

[[propriedade]]
id = "rho_vapor"
rotulo = "densidade da fase vapor"
origem_atual = "P·MW/(Z·R·T) com MW e R do balanço (S&A eq. 1.8)"
origem_proposta = "flash_tp: ρ da fase vapor pela EOS"
consumidores = ["capacidade de gás dos vasos", "velocidade do gás", "arraste de gotas"]
status = "liberada"
motivo = "fase vapor não sofre do problema volumétrico do líquido."

[[propriedade]]
id = "rho_liquido"
rotulo = "densidade da fase líquida"
origem_atual = "óleo: correlação de API (P-07); água: premissa; sem correção por T nem Bo"
origem_proposta = "flash_tp: ρ da fase líquida pela EOS"
consumidores = ["velocidades", "holdup", "tempo de residência", "perda de carga", "hidráulica de bombas", "dimensionamento de vasos e tratadores", "otimização"]
status = "bloqueada"
motivo = "Peng-Robinson sem translação de volume subestima o volume de líquido: razão medida 0,541 contra mistura ideal (474,3 contra 877,3 kg/m³ na condição padrão). NÃO propagar. A fonte validada continua sendo a correlação de API; a proveniência fica marcada."

[[propriedade]]
id = "h"
rotulo = "entalpia"
origem_atual = "cp constante por pseudo-componente (P-10 a P-12), gás ideal a 25 °C, sem calor de flash"
origem_proposta = "flash_tp: entalpia das fases"
consumidores = ["cargas térmicas Q_H, Q_C, Q_D", "P-001, P-002, P-003", "temperaturas de mistura"]
status = "bloqueada"
motivo = "não existe: sem Cp_ig dos pseudo-componentes o pacote não calcula entalpia. A rota energética atual é preservada (item 9)."

[[propriedade]]
id = "cp"
rotulo = "calor específico"
origem_atual = "constante por pseudo-componente (P-10 a P-12)"
origem_proposta = "flash_tp: cp das fases"
consumidores = ["cargas térmicas", "temperatura de mistura", "LMTD dos trocadores"]
status = "bloqueada"
motivo = "idem: ausente por falta de Cp_ig com fonte."

[[propriedade]]
id = "mu"
rotulo = "viscosidade"
origem_atual = "óleo: tabela do BOT + Beggs & Robinson (óleo vivo); água: Laliberté; gás: thermo sobre a composição fixa"
origem_proposta = "flash_tp: μ das fases"
consumidores = ["película dos trocadores", "decantação de gotas", "hidráulica"]
status = "bloqueada"
motivo = "o pacote de pseudo-componentes é montado sem correlações de transporte; μ das fases do fluido de poço volta NaN. A fonte validada continua sendo a atual."

[[propriedade]]
id = "k"
rotulo = "condutividade térmica"
origem_atual = "óleo: entrada proposta; água: lacuna; gás: thermo"
origem_proposta = "flash_tp: k das fases"
consumidores = ["película dos trocadores"]
status = "bloqueada"
motivo = "k da fase líquida de hidrocarboneto é caso (c) da invariante 5 — devolvido pelo backend, extrapolado, não validado. Somado a isso, o pacote de pseudo-componentes não o calcula."

# ---------------------------------------------------------------------------- fechamento
[fechamento]
# Erros de fechamento que o modo sombra registra numericamente em cada flash.
tolerancia_componente = 1.0e-9
tolerancia_soma = 1.0e-9
nota = "critérios NUMÉRICOS de verificação do flash, não premissas físicas. z_i = β·y_i + (1−β)·x_i componente a componente; soma das composições; balanço molar e mássico; e desaparecimento de fase no monofásico."

# ---------------------------------------------------------------------------- F5.1 — cascata
# A F5 avaliou os três pontos como flashes INDEPENDENTES da mesma composição global. A F5.1
# encadeia-os: o líquido de um estágio é a alimentação do próximo, e a quantidade absoluta de
# hidrocarboneto é propagada. Continua tudo em SOMBRA: nenhuma propriedade muda de status aqui.

[cascata]
modo = "sombra"
sequencia = ["SG-001", "V-001", "V-002"]
alimentacao = "z_0 = fluid_compositions[fluid_type] no primeiro estágio; x do estágio anterior nos seguintes"
propagacao = "n_V = β·n_F e n_L = (1−β)·n_F, estágio a estágio"
nota = "o estágio seguinte recebe o LÍQUIDO do anterior. Se um estágio perder a fase líquida, a cascata termina ali e isso é registrado: não se inventa alimentação."

# --------------------------------------------------------------- base molar absoluta
# REGRA DECLARADA, não suposta. O arquivo de casos NÃO traz vazão molar, e as três grandezas
# que existem (oil_sm3d, produced_gas_sm3d e fluid_compositions) são INCOMPATÍVEIS entre si:
# a composição é por TIPO DE FLUIDO e os sete tipos aparecem em casos com GOR diferentes, de
# modo que nenhum split de fases na condição padrão reproduz os dois volumes de todos os casos
# (medido: a razão GOR do flash / GOR do BOT vai de 0,62 a 2,16). Por isso a base molar NÃO é
# derivada de um split: é derivada da MASSA, que é a grandeza que o balanço produtivo conserva.
[base_molar]
regra = "n_F = m_HC,in / MW_z"
massa = "m_HC,in = oil_sm3d·ρ_óleo(API) + produced_gas_sm3d·ρ_gás,padrão — os MESMOS dois termos, com as MESMAS duas massas específicas, que o balanço produtivo põe em C-01"
mw = "MW_z = Σ_fases (fração molar · MW da fase) do flash do primeiro estágio: o MW da mistura pelos MW ADOTADOS nas entradas e na caracterização (F4), não o MW verdadeiro do petróleo real"
rho_oleo = "ρ = (141,5/(131,5 + API))·ρ_água,15,6 °C — API do poço, dado do BOT (o mesmo do balanço)"
rho_gas = "ρ = MW_corte_leve / V_M, com V_M = R·T_padrão/P_padrão — a definição de sm³ (o mesmo V_M e o mesmo corte leve do balanço)"
unidade = "kmol/d"
inclui_gas_de_lift = false
por_que_nao_o_split = "usar o split de fases na condição padrão para fixar a base exigiria escolher entre a base do gás (n_gás/β) e a base do óleo (n_óleo/(1−β)), que discordam entre 0,7 % e 116 % nos 16 casos. Escolher uma delas seria inventar quantidade molar para fechar o flash."
conserva = "a massa total de hidrocarboneto é a mesma do balanço produtivo (menos o gás de lift, ver a lacuna), então a cascata e o modelo legado partem dos mesmos quilogramas"

[[lacuna_cascata]]
id = "composicao_gas_de_lift"
grandeza = "composição do gás de lift"
situacao = "ausente"
fonte_procurada = "BOT I-ET-3010.2K-1200-941-P4X-001 rev. C, §2.3.3 (Service and Lift Gas)"
o_que_a_fonte_da = "apenas ESPECIFICAÇÃO de envelope — máximo 5 ppmv de H2S, máximo 3 % mol de CO2, máximo 1 ppmv de H2O —, que são limites superiores, não uma composição"
o_que_existe_na_fonte = "a composição do gás TRANSFERIDO (GT30/GT40/GT50) está na Tabela 2.3.5.1; ela é de outra corrente, que não entra em C-01, e não pode ser usada como se fosse a do gás de lift"
efeito = "nos casos com lift_gas_sm3d > 0 o balanço produtivo soma o lift ao gás de entrada (Gin = produced + lift) e converte a massa com a ρ_padrão do CORTE LEVE DO FLUIDO DE POÇO, isto é, atribui ao gás de lift a composição do poço. A cascata em sombra NÃO faz isso: ela exclui o lift da base molar e declara a lacuna."
decisao = "não supor composição. A base molar da cascata usa só o gás produzido; a diferença em relação ao balanço é reportada caso a caso."
