# Entradas dos métodos que NÃO vêm do balanço nem das propriedades, por método, valendo
# para todo TAG que o usa (o TAG pode sobrescrever em [entradas] ou [recomendadas]).
#
# Cada chave é uma de:
#   { tipo = "fonte",     fonte = "..." }  default do método, com fonte conferida no acervo
#   { tipo = "escolha",   fonte = "..." }  escolha de projeto: a configuração padrão do método,
#                                          listada no MC para revisão (não é dado de processo)
#   { tipo = "nao_usado", fonte = "..." }  o método exige a chave, mas ela não entra no cálculo
#   { regra = "...", ... }                 regra de pfd/entradas.py (ex.: grade de busca)
# Parâmetro que não está aqui nem no TAG é LACUNA (regra das fontes). [<método>.dicas] ajuda
# o usuário a preencher a lacuna, citando o que o acervo oferece.

[stewart_arnold]
dm_water = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §4.7.2: gotas de água de 500 µm" }
dm_oil = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §4.7.3: gotas de óleo de 200 µm" }
dm_gas = { tipo = "fonte", fonte = "Stewart & Arnold (2008), exemplo de projeto p. 168: remoção de líquido de 100 µm" }
d_min = { regra = "grade_descritor", limite = "min" }
d_max = { regra = "grade_descritor", limite = "max" }
d_step = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §3.8.6, p. 126: cascos em incrementos de 150 mm (6 in)" }
sr_min = { tipo = "fonte", fonte = "Stewart & Arnold (2008) cap. 4: comprimento/diâmetro 'between 3 and 5'" }
sr_max = { tipo = "fonte", fonte = "Stewart & Arnold (2008) cap. 4: comprimento/diâmetro 'between 3 and 5'" }
sr_target = { tipo = "fonte", fonte = "centro da banda de Stewart & Arnold (2008)" }

# Premissa P-42 (BOT Tab. 2.2.2.3 Notas 5 e 11; BOT 2.3.1.1 como limite superior): nos casos
# sem vazão de água (BSW 0 %) e com óleo, os critérios que dependem da fase aquosa não se
# aplicam. As chaves abaixo, quando seriam lacuna, recomendação ou default do método,
# viram "não aplicável" nesses casos: não são pedidas nem revisadas. Valores do balanço,
# das propriedades e do usuário permanecem. O método ignora-as (sizing/vasos.sem_fase_aquosa).
[stewart_arnold.fase_aquosa]
vazao = "q_water"
oleo = "q_oil"
parametros = ["dm_water", "dm_oil", "tr_water", "rho_water", "mu_water"]
dispensaveis = ["lacuna", "recomendada", "metodo", "proposta"]
fonte = "P-42: sem fase aquosa neste caso (BOT Tab. 2.2.2.3 Notas 5 e 11; 2.3.1.1); critério não aplicável"

[stewart_arnold_2f]
dm_gas = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §3.7.1: equações de capacidade de gás baseadas em remoção de 140 µm" }
d_min = { regra = "grade_descritor", limite = "min" }
d_max = { regra = "grade_descritor", limite = "max" }
d_step = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §3.8.6, p. 126: cascos em incrementos de 150 mm (6 in)" }
sr_min = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §3.8.5: esbeltez entre 3 e 4" }
sr_max = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §3.8.5: esbeltez entre 3 e 4" }
sr_target = { tipo = "fonte", fonte = "centro da banda de Stewart & Arnold (2008) §3.8.5" }

[arnold_electrostatic]
dm_oil = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §4.7.3: gotas de óleo de 200 µm" }
d_min = { regra = "grade_descritor", limite = "min" }
d_max = { regra = "grade_descritor", limite = "max" }
d_step = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §4.9.3: 'heads come in outside diameters, which are multiples of 6 in. (150 mm)'" }
sr_min = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §4.9.2: Lss/d entre 3 e 5" }
sr_max = { tipo = "fonte", fonte = "Stewart & Arnold (2008) §4.9.2: Lss/d entre 3 e 5" }
sr_target = { tipo = "fonte", fonte = "centro da banda de Stewart & Arnold (2008) §4.9.2" }

# Premissa P-42 (BOT Tab. 2.2.2.3 Notas 5 e 11; BOT 2.3.1.1 como limite superior): nos casos
# sem vazão de água (BSW 0 %) e com óleo, os critérios que dependem da fase aquosa não se
# aplicam. As chaves abaixo, quando seriam lacuna, recomendação ou default do método,
# viram "não aplicável" nesses casos: não são pedidas nem revisadas. Valores do balanço,
