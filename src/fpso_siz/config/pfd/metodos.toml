fonte = "P-42: sem fase aquosa neste caso (BOT Tab. 2.2.2.3 Notas 5 e 11; 2.3.1.1); critério não aplicável"

[arnold_electrostatic.dicas]
dm_water = "Sem fonte no acervo: a correlação campo elétrico → gotícula coalescida está no volume 'Emulsions and Oil Treating' da série, que não temos. §4.7.2 dimensiona para 500 µm SEM tratamento; com dado de laboratório, use o dado."

