# F15 — otimização multiobjetivo do módulo (docs/decisoes/0003-otimizacao-pymoo.md).
#
# ESTADO DA PRÉ-CONDIÇÃO: o documento 0003 exige "nenhum alarme aberto" antes da primeira
# rodada. Os alarmes do P-002 e do P-003 FECHARAM com a película do lado tubo nos três regimes
# (docs/validacao/24-pelicula-baixo-reynolds.md). O P-001 deixou de ser DESIGN inviável: é a
# geometria instalada avaliada por rating (ADR 0005, notas 45/46), com recuperação parcial aceita
# e o comprimento do tubo como DECISÃO PENDENTE (nota 46). Enquanto ela estiver aberta nenhum
# ponto que contenha o P-001 sai como `viavel` (sai `decisao_pendente`), e nenhum ponto da frente
# é recomendação de projeto (docs/validacao/47).
#
# Tudo o que a otimização pode mexer está declarado aqui, com LIMITE DE ORIGEM DECLARADA (a
# tabela do 0003). O código não nomeia variável nem objetivo: itera estas listas. Valor com
# status "proposto" (config/pfd/pendencias_propostas.toml) NÃO é variável de decisão.

# ---------------------------------------------------------------------------- variáveis
# destino: "premissa" (altera o balanço) | "tag_geral" (entrada do método, todos os casos)
#          | "fator_vazao" (divide a vazão do TAG por N trens iguais)
# tipo: "real" | "inteiro"

[[variavel]]
id = "eta_F"
rotulo = "η_padrão do SG-001 (P-43)"
destino = "premissa"
chave = "eta_F"
tipo = "real"
min = 0.80
max = 0.90
fonte = "faixa de 80–90 % declarada pelo usuário para a P-43 (F10w); não há valor suposto"

[[variavel]]
id = "trens_sg"
rotulo = "número de trens do SG-001"
destino = "fator_vazao"
tag = "SG-001"
chaves = ["q_oil", "q_water", "q_gas"]
tipo = "inteiro"
min = 1
max = 3
fonte = "divisão da vazão por um número inteiro de vasos iguais (mesma variante dos alarmes, trens_2/trens_3); arranjo, não valor suposto"

[[variavel]]
id = "passes_p002"
rotulo = "passes no tubo do P-002"
destino = "tag_geral"
tag = "P-002"
chave = "passes_tubo"
tipo = "inteiro"
min = 1
max = 2
fonte = "faixa do descritor passes_tubo (Saari: 1 contracorrente §4.2.1; 2 no arranjo 1-2, Fig. 4.3)"

[[variavel]]
id = "passes_p003"
rotulo = "passes no tubo do P-003"
destino = "tag_geral"
tag = "P-003"
chave = "passes_tubo"
tipo = "inteiro"
min = 1
max = 2
fonte = "faixa do descritor passes_tubo (Saari)"

# P_D1 e P_D2: variáveis do SUBPROBLEMA DE PRESSÃO (docs/validacao/42), não do problema completo
# ([completo] abaixo). Os extremos são DOMÍNIO DE ESTUDO declarado — a região da Nota 41
# (docs/validacao/41) —, não limite de projeto: `natureza_min`/`natureza_max` dizem de onde cada
# extremo vem. Os limites com fonte ou de processo que existem ficam como RESTRIÇÃO explícita
# (TVP, P_D2 < P_D1) ou fora do domínio (sucção do compressor, 2.200 kPa, BOT estimado);
# o piso de P_D2 não tem fonte (101,3 kPa, sucção do 1º estágio da VRU) e não vira bound.
[[variavel]]
id = "P_D1"
rotulo = "pressão do V-001 (P_D1)"
destino = "premissa"
chave = "P_D1"
tipo = "real"
unidade = "kPa"
min = 200.0
max = 2000.0
natureza_min = "dominio_estudo"
natureza_max = "dominio_estudo"
fonte = "domínio de estudo da Nota 41 (grade do mapa determinístico); o máximo fica abaixo do limite com fonte da sucção do compressor principal, 2.200 kPa (BOT §2.7.3.9.20.1, valor ESTIMADO pelo BOT), que por isso nunca fica ativo"

[[variavel]]
id = "P_D2"
rotulo = "pressão do V-002 (P_D2)"
destino = "premissa"
chave = "P_D2"
tipo = "real"
unidade = "kPa"
min = 110.0
max = 250.0
natureza_min = "dominio_estudo"
natureza_max = "dominio_estudo"
fonte = "domínio de estudo da Nota 41; o piso físico de P_D2 (sucção do 1º estágio da VRU) não tem fonte, e 110 kPa é só o extremo explorado; o teto efetivo vem da restrição de TVP, não de bound"

# ---------------------------------------------------------------------------- objetivos
# tipo: "soma_derivado" (soma um derivado dos TAGs listados) | "soma_area_troca" | "carga_balanco"
# (soma cargas do balanço no caso de projeto do critério declarado; `etapa` = "preliminar" (padrão)
# ou "apos_rating")
# sentido: "minimizar" (o único usado; declarado para não ficar implícito)

[[objetivo]]
id = "volume_vasos"
rotulo = "volume total dos vasos"
unidade = "m³"
tipo = "soma_derivado"
derivado = "volume"
tags = ["SG-001", "V-001", "V-002", "TO-001", "TO-002"]
sentido = "minimizar"
fonte = "proxy de peso e área de convés (0003); o volume é o derivado que os métodos de vaso já emitem"

[[objetivo]]
id = "carga_aquecimento"
rotulo = "carga de aquecimento"
unidade = "kW"
tipo = "carga_balanco"
cargas = ["Q_H", "Q_D"]
agregacao = "maximo_entre_casos"
# depois do rating do P-001: a parcela não recuperada pela geometria instalada vai ao P-002 (nota 45)
etapa = "apos_rating"
sentido = "minimizar"
fonte = "utilidade de aquecimento do módulo (BOT 3.4): P-002 (Q_H) e DWH-001 (Q_D), no estado operacional depois do rating do P-001; o dimensionamento da utilidade responde ao caso de maior carga. Os 16 casos são cenários alternativos: o máximo é o caso que dimensiona, não consumo simultâneo nem energia anual (não há frequências declaradas)"

# soma_area_troca: soma `base` das áreas de `equipamento.areas_troca` (a mesma regra do JSON e
# do memorial). "instalada_m2" inclui a reserva (indicador de investimento); "em_operacao_m2" é a
# área que troca calor (avaliação térmica). Não é custo: não há preço nem correlação de custo.
[[objetivo]]
id = "area_trocadores"
rotulo = "área instalada de troca (indicador de investimento, não custo)"
unidade = "m²"
tipo = "soma_area_troca"
base = "instalada_m2"
tags = ["P-001", "P-002", "P-003"]
sentido = "minimizar"
fonte = "área de troca como indicador do investimento dos trocadores (0003). Instalada: o P-001 conta as unidades em operação e a reserva (ADR 0005, nota 45); P-002 e P-003, os cascos em série × paralelo do método (sem reserva modelada). Não é custo calculado"

# Objetivos do SUBPROBLEMA DE PRESSÃO (docs/validacao/42). Sem preço, custo ou peso.
# razao_componente: Σ_casos m(componente, corrente) / Σ_casos m(componente, referencia), das
#   correntes do EstadoProcesso (kg/s); `complemento = true` minimiza 1 − razão.
# carga_balanco com `campo`: soma as chaves de r.<campo> (padrão: duties) em cada caso.
# `casos`: "avaliaveis" (os 12 do trem produtivo) | ausente (todos os casos do balanço).
[[objetivo]]
id = "perda_oleo"
rotulo = "perda de óleo estabilizado (1 − recuperação mássica)"
unidade = "–"
tipo = "razao_componente"
componente = "O"
corrente = "C-25"
referencia = "C-01"
complemento = true
casos = "avaliaveis"
sentido = "minimizar"
fonte = "recuperação = Σ ṁ_O(C-25, óleo à estocagem) / Σ ṁ_O(C-01, alimentação) nos 12 casos avaliáveis; O é o teor de óleo de tanque (flash à condição padrão), conservado pelo trem (docs/validacao/39), e o que falta sai pelas outras saídas globais: como O nos vapores do SG-001, V-001 e V-002 e no óleo da água do FWKO (C-05, fixado pela premissa de teor de óleo na água, não pela pressão). Adimensional; por caso, massa e volume padrão dão a mesma razão (mesma ρ_O). Maximizar a recuperação = minimizar 1 − recuperação"

[[objetivo]]
id = "carga_vru"
rotulo = "carga de vapor da VRU (V-001 + V-002)"
unidade = "Sm³/d"
tipo = "carga_balanco"
campo = "gas"
cargas = ["G_D1", "G_D2"]
agregacao = "maximo_entre_casos"
sentido = "minimizar"
fonte = "vazão de vapor que chega à VRU (V-001 + V-002, Sm³/d) já calculada pelo balanço; o máximo entre os 16 casos, como o envelope com que os vasos são dimensionados. Não é potência de compressor (sem modelo de compressor)"

# ---------------------------------------------------------------------------- restrições
[restricoes]
# Cada TAG tem de ficar viável. A violação é MEDIDA DE DISTÂNCIA ao admissível, não grandeza
# física: fração dos casos ativos sem solução isolada, mais um termo relativo quando o motor
# publica um teto (o quanto o menor x da grade excede o teto). Assim um indivíduo "quase viável"
# pontua melhor que um sem solução em caso nenhum, que é o que o NSGA-II precisa para caminhar.
tags = ["SG-001", "V-001", "V-002", "TO-001", "TO-002", "P-001", "P-002", "P-003", "B-001", "B-002", "B-003"]
# TAG que espera entrada (lacuna) ou que fica inativo não é violação de projeto: é estado de
# dado. A rodada registra e a MEDIDA DE VIOLAÇÃO os ignora — lacuna continua lacuna.
estados_neutros = ["aguardando_entrada", "inativo"]
# Mas neutro na violação não é o mesmo que projeto avaliado. São dois estados diferentes:
#   inativo            → o TAG não opera naquele ponto; nada a dimensionar, e o ponto segue
#                        julgável;
#   aguardando_entrada → falta DADO; não se sabe se o TAG atende. O ponto é "não avaliável" e
#                        NÃO pode sair como viável — nem da frente, nem do relatório.
# Por isso o algoritmo recebe, além das violações por TAG, uma restrição a mais que conta os
# TAGs sem dado: falta de dado não vira viabilidade por omissão.
estados_sem_dado = ["aguardando_entrada"]
fonte = "restrições do contrato de dimensionamento como estado (0003); a métrica de violação é critério numérico da otimização, não premissa física"

# Restrição do BALANÇO: uma grandeza do EstadoProcesso contra um limite com fonte. A violação é
# CONTÍNUA, g = máx_casos(grandeza) / limite − 1 (g ≤ 0 atende; g < 0 é folga), e só nos casos da
# classe declarada. Caso em que a grandeza não existe (NaN) deixa o ponto não avaliável.
[[restricao_balanco]]
id = "tvp"
rotulo = "TVP do óleo tratado na estocagem ≤ limite do BOT"
grandeza = "tvp_kPa"
limite = { arquivo = "trem.toml", secao = "tvp", chave = "limite_kPa" }
casos = "avaliaveis"
natureza = "fonte"
fonte = "BOT I-ET-3010.2K-1200-941-P4X-001 rev. C, §2.3.1.1 (TVP ≤ 70 kPa) e §2.7.1.10 (na estocagem). Verificada só nos 12 casos avaliáveis: nos 4 com gás de lift (9, 11, 15, 16) não há composição e a TVP NÃO é verificada. É restrição, não bound de P_D2"

# Restrição entre VARIÁVEIS (topologia): g = 1 + (x_menor − x_maior)/x_maior quando x_menor ≥
# x_maior, 0 caso contrário. O ponto que a viola não é avaliado (o processo não existe nele).
[[restricao_variavel]]
id = "p_d2_menor_que_p_d1"
rotulo = "P_D2 < P_D1"
menor = "P_D2"
maior = "P_D1"
natureza = "processo"
fonte = "topologia do BOT (Fig. 2.7.1.17): o líquido do V-001 segue ao V-002 sem bomba; o ΔP mínimo de transferência não tem fonte"

[algoritmo]
# NSGA-II para 2–3 objetivos; NSGA-III (direções de Das-Dennis) a partir de 4 (0003).
objetivos_max_nsga2 = 3
populacao = 40
geracoes = 20
semente = 1
fonte = "0003: populações de 40–100 com avaliação cara; semente fixa para reprodutibilidade"

# ---------------------------------------------------------------------------- problema completo
# O problema completo da F15 (Rodada 1 do docs/validacao/23): as variáveis e objetivos com que
# ele foi declarado. Explícito para que a variável ou o objetivo de um subproblema novo não entre
# nele por omissão.
[completo]
variaveis = ["eta_F", "trens_sg", "passes_p002", "passes_p003"]
objetivos = ["volume_vasos", "carga_aquecimento", "area_trocadores"]

# ---------------------------------------------------------------------------- subproblemas
# Um subproblema restringe variáveis, objetivos e TAGs restringidos. Existe por duas razões
# declaradas: (1) o critério de validação 2 do 0003 exige comparar a frente do NSGA-II com uma
# varredura exaustiva da MESMA grade, e isso só é exaustível num subproblema pequeno; (2) com o
# alarme do P-001 aberto, o problema completo não tem ponto viável — a rodada completa serve
# para mostrar isso, não para recomendar projeto.

[[subproblema]]
id = "sg_001"
rotulo = "SG-001: η_padrão × número de trens"
variaveis = ["eta_F", "trens_sg"]
objetivos = ["volume_vasos", "carga_aquecimento"]
tags = ["SG-001", "V-001", "V-002", "TO-001", "TO-002", "B-001", "B-002", "B-003"]
fonte = "critério de validação 2 do 0003 (docs/decisoes/0003-otimizacao-pymoo.md): subproblema pequeno cuja frente é conferível contra varredura exaustiva; os trocadores ficam fora porque o alarme do P-001 segue aberto"
# Passo da grade da varredura exaustiva com que a frente é conferida. É critério NUMÉRICO da
# validação (resolução da conferência), não premissa física; variável inteira anda de 1 em 1.
grade_passo = { eta_F = 0.02 }

[[subproblema]]
id = "configuracao"
rotulo = "configuração de equipamentos: trens do SG-001 × passes do P-002 × passes do P-003"
variaveis = ["trens_sg", "passes_p002", "passes_p003"]
objetivos = ["volume_vasos", "area_trocadores", "carga_aquecimento"]
tags = ["SG-001", "V-001", "V-002", "TO-001", "TO-002", "P-001", "P-002", "P-003", "B-001", "B-002", "B-003"]
fonte = "comparação de candidatos de configuração para avaliação posterior no HYSYS (docs/validacao/47): domínio discreto e finito (3 × 2 × 2 = 12 pontos, as faixas declaradas de cada variável), premissas do balanço na base (η_F fica fora: é premissa de processo, não configuração), a planta inteira pelo mesmo serviço por TAG. O P-001 sai da busca discreta própria (p_001_busca.toml) e é o mesmo em todos os candidatos"
[subproblema.comparacao]
# Limite de avaliações (cada uma é a planta inteira, ~10–30 s). Atingido o limite, a comparação
# devolve o parcial e lista os pontos não avaliados. Critério de execução, não premissa física.
max_avaliacoes = 12

[[subproblema]]
id = "pressao"
rotulo = "pressões de separação: P_D1 × P_D2"
variaveis = ["P_D1", "P_D2"]
objetivos = ["perda_oleo", "carga_vru"]
tags = ["SG-001", "V-001", "V-002"]
restricoes_balanco = ["tvp"]
restricoes_variavel = ["p_d2_menor_que_p_d1"]
# só os TAGs do subproblema são dimensionados: P-001, P-002, P-003, TO-001, TO-002 e as bombas
# ficam FORA (o P-001 segue inviável e não bloqueia este recorte, docs/validacao/41)
dimensiona_so_tags = true
fonte = "subproblema de pressão e separação (docs/validacao/42): P_D1, P_D2 → balanço (resolver_todos, recombinação da Nota 4, trem) → SG-001, V-001, V-002 → objetivos e restrições. Não é a otimização da planta inteira"
grade_passo = { P_D1 = 150.0, P_D2 = 10.0 }
# Relatório de cada ponto da frente (tools/otimizar.py): grandezas do balanço (máximo entre os
# casos) e potências das bombas, só como métricas AUXILIARES — não são objetivo.
relatorio_gas = ["G_F", "G_D1", "G_D2"]
relatorio_potencias = ["W_Bo", "W_B1", "W_B2"]
