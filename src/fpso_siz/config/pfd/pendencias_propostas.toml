# Valores PROPOSTOS para as entradas sem fonte técnica rastreável (F10x).
#
# Gerado a partir do inventário das lacunas do código (`fpso-siz pfd` sem ajustes): as 43
# entradas que o catálogo deixa sem valor, em 8 TAGs, porque não há fonte no acervo, no BOT
# nem em norma citável. NÃO são dados validados. Cada item:
#   - status = "proposto": só este status entra pelo mecanismo de propostas;
#   - origem = "proposta do usuário …": valor inicial escolhido pelo autor para o fluxo rodar;
#   - justificativa: raciocínio físico do valor inicial (sem referência bibliográfica,
#     normativa ou do BOT atribuída ao número).
# Precedência: só preenche LACUNA (usuário > regra do TAG > recomendada > default com fonte >
# proposta > lacuna). Carregado POR PADRÃO pela CLI e pelo modo interativo (decisão do usuário,
# 2026-09-26: "pode seguir com os valores propostos; para mudar, selecionar a opção e editar").
# Para mudar um valor: no modo interativo, TAG → "Revisar recomendações e defaults" (confirmar ou
# editar) ou "Editar entrada"; a edição vira entrada do usuário nos ajustes e prevalece. Outro
# arquivo: --propostas ARQ; nenhum: --sem-propostas.

