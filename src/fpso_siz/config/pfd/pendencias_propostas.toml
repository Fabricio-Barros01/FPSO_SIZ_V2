chave = "dm_water"
valor = 1000.0
unidade = "µm"
status = "proposto"
origem = "proposta do usuário (autor do TCC)"
justificativa = "Sem correlação campo elétrico → gotícula no acervo (dica do código). Adota-se 1000 µm, a premissa do autor já registrada no descritor do método (nota de dm_water em equipment/treater/electrostatic.toml): 2× os 500 µm que S&A §4.7.2 usa sem tratamento, isto é, ganho de 4× na decantação. Com 500 µm (sem crédito do campo) o tratador não teria razão de ser; a confirmar com dado de laboratório."

