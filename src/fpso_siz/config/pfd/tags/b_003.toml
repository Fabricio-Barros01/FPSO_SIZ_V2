# B-003 — Bomba de água produzida do dessalinizador. Sucção C-19 (saída do TO-002), recalque C-20 (topologia do balanço).
# Pressão de sucção = P do vaso a montante; pressão de recalque = P da corrente de descarga
# (premissas de pressão do balanço). O líquido sai do vaso no ponto de bolha: Pv = P do vaso
# (Branan, Ex. 5-2). Líquido como fase única, com a fase contínua "agua".
tag = "B-003"
nome = "Bomba de água produzida do dessalinizador"
equipamento = "pump"
metodo = "moran"
bloco = "B-003"
condicao = "C-19"

[entradas]
q_oil = { regra = "vazao_fase", corrente = "C-19", fase = "liquido" }
rho_oil = { regra = "densidade_fase", corrente = "C-19", fase = "liquido" }
mu_oil = { regra = "viscosidade_fase", corrente = "C-19", fase = "liquido", continua = "agua" }
pressure = { regra = "pressao", corrente = "C-19" }
temperature = { regra = "temperatura", corrente = "C-19" }
p_recalque = { regra = "pressao", corrente = "C-20" }
pv_informada = { regra = "pressao_vapor_saturado", corrente = "C-19" }
rendimento = { regra = "premissa", nome = "eta_pump" }

[inativo_se]
vazao_nula = "q_oil"

[recomendadas.piso_caso_projeto]
valor = 1.0
fonte = "P-44 (aprovada pelo usuário, 2026-09-26): a linha é dimensionada pelo caso de maior vazão; o piso de velocidade vale só nele e os casos de menor vazão operam abaixo dele (turndown); o teto vale em todos"

[recomendadas.transicao_turndown]
valor = 1.0
fonte = "P-44b (decorre da P-44; a confirmar): nos casos de turndown, a zona de transição laminar-turbulento é aceita com o fator de Colebrook-White como limite superior (f ≥ 64/Re): perda de carga superestimada e NPSH subestimado, lado seguro. O caso de projeto segue exigindo correlação válida (Moran 2016: Colebrook-White para Re > 4000)"
