[recomendadas.passes_tubo]
valor = 1.0
fonte = "melhor candidato da busca discreta de layout (tools/buscar_layout_trocador.py; eixos, regra de seleção e limite de acervo em config/pfd/layout_trocador.toml; frente de Pareto, alternativas e tabela dos 16 casos em docs/validacao/43-design-rating-multiplicidade.md). Avaliado pelo caminho produtivo inteiro: DESIGN no caso de projeto, RATING nos 16 casos com as propriedades reavaliadas no ponto fixo, e o conjunto integrado (P-002 e P-003 pelas cargas residuais, temperaturas finais da ET) verificado. Um passe é contracorrente puro (F = 1, Saari §4.2.1): com dois passes o fator F do arranjo 1-2 sai do domínio da Fig. 4.3 nesta troca quase simétrica (R ≈ 1), e NENHUM candidato de 2 passes foi viável na busca."

[recomendadas.l_tubo_max]
valor = 6.0
fonte = "melhor candidato da busca discreta de layout (tools/buscar_layout_trocador.py; eixos, regra de seleção e limite de acervo em config/pfd/layout_trocador.toml; frente de Pareto, alternativas e tabela dos 16 casos em docs/validacao/43-design-rating-multiplicidade.md). Avaliado pelo caminho produtivo inteiro: DESIGN no caso de projeto, RATING nos 16 casos com as propriedades reavaliadas no ponto fixo, e o conjunto integrado (P-002 e P-003 pelas cargas residuais, temperaturas finais da ET) verificado. É o default do método e o limite do acervo (Branan p. 38: 4 a 20 ft). A busca varreu 6, 7, 8 e 9 m a pedido do usuário; o candidato registrado fica em 6 m porque acima disso não há fonte — docs/validacao/43 mostra o que os 7 m comprariam."

[recomendadas.cascos_paralelo]
valor = 4.0
fonte = "melhor candidato da busca discreta de layout (tools/buscar_layout_trocador.py; eixos, regra de seleção e limite de acervo em config/pfd/layout_trocador.toml; frente de Pareto, alternativas e tabela dos 16 casos em docs/validacao/43-design-rating-multiplicidade.md). Avaliado pelo caminho produtivo inteiro: DESIGN no caso de projeto, RATING nos 16 casos com as propriedades reavaliadas no ponto fixo, e o conjunto integrado (P-002 e P-003 pelas cargas residuais, temperaturas finais da ET) verificado. Quatro trens em paralelo, cada um com 1/4 das vazões dos dois lados. Com reserva INSTALADA exigida pela ET (BOT 2.7.1.11), dividir o serviço em mais trens reduz a penalidade da reserva: ela passa a ser 1/4 da área de operação em vez de uma segunda planta inteira."

[recomendadas.trens_reserva]
