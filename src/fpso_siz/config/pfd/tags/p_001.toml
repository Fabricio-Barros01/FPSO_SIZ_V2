# P-001 — pré-aquecedor óleo/óleo. Convenção do PFD F1 do Julia (para revisão, não decisão
# mecânica): processo frio no TUBO (C-06 → C-07, emulsão do FWKO), óleo tratado quente no
# CASCO (C-22 → C-23). Propriedades de cada lado na temperatura média de mistura (Saari
# Eq. 6.21, nota do método). Emulsão com o óleo como fase contínua (BOT, nota 1 da
# Tab. 2.2.1.2: "emulsified oil viscosity").
tag = "P-001"
nome = "Pré-aquecedor óleo/óleo"
equipamento = "exchanger"
metodo = "saari_lmtd"
bloco = "P-001"

[entradas]
m_tubo = { regra = "vazao_massica", corrente = "C-06" }
cp_tubo = { regra = "cp_corrente", corrente = "C-06" }
t_tubo_in = { regra = "temperatura", corrente = "C-06" }
t_tubo_out = { regra = "temperatura", corrente = "C-07" }
rho_tubo = { regra = "densidade_fase", corrente = "C-06", fase = "liquido", t = ["C-06", "C-07"] }
mu_tubo = { regra = "viscosidade_fase", corrente = "C-06", fase = "liquido", continua = "oleo", t = ["C-06", "C-07"] }
m_casco = { regra = "vazao_massica", corrente = "C-22" }
cp_casco = { regra = "cp_corrente", corrente = "C-22" }
t_casco_in = { regra = "temperatura", corrente = "C-22" }
mu_casco = { regra = "viscosidade_fase", corrente = "C-22", fase = "liquido", continua = "oleo", t = ["C-22", "C-23"] }
rho_casco = { regra = "densidade_fase", corrente = "C-22", fase = "liquido", t = ["C-22", "C-23"] }  # só a ΔP do casco (Branan 2-33)

# ΔP máximo do lado tubo: a premissa P-17 do balanço (ΔP por lado de trocador). Não é valor
# novo — é a mesma premissa que o balanço usa para escrever a pressão de C-07, lida do balanço.
[entradas.dp_max]
regra = "premissa"
nome = "dP_HX"

[inativo_se]
carga_nula = "Q_pre"

[recomendadas.banda_caso_projeto]
valor = 1.0
fonte = "P-45 (decisão do usuário, 2026-09-26; específica de trocadores): teto de velocidade em todos os casos; banda inteira no caso de projeto (maior vazão volumétrica no tubo); abaixo do piso no turndown, alerta de operabilidade/incrustação; Dittus-Boelter exigido na faixa em cada caso"

[recomendadas.pelicula_baixo_re]
valor = 1.0
fonte = "Branan (2012), cap. 2, pp. 40-41: a película do lado tubo tem correlação declarada nos três regimes — Hausen (eq. 2-10) em Re ≤ 2000, interpolação (eq. 2-12) em 2000 < Re < 10⁴ e Dittus-Boelter (Saari eq. 6.23) em Re ≥ 10⁴. Este TAG opera em baixa carga fora da faixa turbulenta, e sem os três regimes os casos de turndown eram RECUSADOS por falta de correlação, não por limite físico (docs/validacao/24-pelicula-baixo-reynolds.md)"

[recomendadas.rating_fora_do_projeto]
valor = 1.0
fonte = "ADR 0005 (docs/decisoes/0005-design-rating-multiplicidade.md), alternativa A5 de docs/validacao/36: a geometria é dimensionada pelo caso de PROJETO e CLASSIFICADA (rating) nos de turndown; a carga é a do balanço preliminar (P-32), e o que a área instalada não recuperar em cada caso é compensado pelas utilidades, com o P-002 e o P-003 dimensionados pelas cargas residuais (docs/validacao/43)"

# ---------------------------------------------------------------------------------------------
# GEOMETRIA ESCOLHIDA (ADR 0005; docs/validacao/43). Vem da busca discreta
# `tools/buscar_layout_trocador.py` sobre os eixos declarados em config/pfd/layout_trocador.toml:
# 1.024 candidatos térmicos no estágio 1 (380 viáveis, frente de Pareto de 59) e 220
# empacotamentos no estágio 2 (191 viáveis, frente de 44). Cada candidato foi avaliado pelo
# caminho produtivo inteiro — DESIGN no caso de projeto, RATING nos 16 casos com as propriedades
# reavaliadas no ponto fixo, velocidade, faixa da correlação de película, diâmetro de casco,
# comprimento por casco e perda de carga cobrados em todos os casos, e o aquecedor e o
# resfriador redimensionados pelas cargas residuais.
#
# O candidato registrado é o de menor ÁREA INSTALADA POR kW RECUPERADO entre os da frente com
# comprimento de tubo dentro do acervo (≤ 6 m, Branan p. 38). Na busca (P-18/P-19 = 700/200
# kPa): 4.537,6 m² de operação (4 trens) + 1 trem de reserva = 5.672 m² instalados, 96,10 % da
# carga do balanço realizada, ΔP de 98,2 kPa contra os 100 kPa da P-17. Com 500/130 kPa
# (docs/validacao/44), a mesma geometria dá 4.392,5 m² de operação e 5.490,7 m² instalados. A faixa de 7 a 9 m pedida
# pelo usuário foi varrida e o que ela compraria está tabelado em docs/validacao/43 (4.191 m²
# com 95,17 %, em 45 cascos de 7 m) — mas 7 m não tem fonte no acervo e por isso não vai ao
# catálogo. Trocar a regra de seleção ou o limite de acervo é trocar uma linha em
# config/pfd/layout_trocador.toml e rodar a busca de novo.

[recomendadas.d_externo]
valor = 19.05
fonte = "melhor candidato da busca discreta de layout (tools/buscar_layout_trocador.py; eixos, regra de seleção e limite de acervo em config/pfd/layout_trocador.toml; frente de Pareto, alternativas e tabela dos 16 casos em docs/validacao/43-design-rating-multiplicidade.md). Avaliado pelo caminho produtivo inteiro: DESIGN no caso de projeto, RATING nos 16 casos com as propriedades reavaliadas no ponto fixo, e o conjunto integrado (P-002 e P-003 pelas cargas residuais, temperaturas finais da ET) verificado."

