# P-001 — pré-aquecedor óleo/óleo. Convenção do PFD F1 do Julia (para revisão, não decisão
# mecânica): processo frio no TUBO (C-06 → C-07, emulsão do FWKO), óleo tratado quente no
# CASCO (C-22 → C-23). Propriedades de cada lado na temperatura média de mistura (Saari
# Eq. 6.21, nota do método). Emulsão com o óleo como fase contínua (BOT, nota 1 da
# Tab. 2.2.1.2: "emulsified oil viscosity").
tag = "P-001"
nome = "Pré-aquecedor óleo/óleo"
equipamento = "exchanger"
metodo = "saari_lmtd"
bloco = "P-001"

[servico]
status = "busca"
instaladas_admissiveis = [1, 2, 3]
duty_admissiveis = [1, 2, 3]
standby_admissiveis = [0, 1, 2]
fonte = "Domínio inicial de estudo solicitado em 2026-09-30; não é filosofia instalada aprovada"

[entradas]
m_tubo = { regra = "vazao_massica", corrente = "C-06" }
cp_tubo = { regra = "cp_corrente", corrente = "C-06" }
t_tubo_in = { regra = "temperatura", corrente = "C-06" }
t_tubo_out = { regra = "temperatura", corrente = "C-07" }
rho_tubo = { regra = "densidade_fase", corrente = "C-06", fase = "liquido", t = ["C-06", "C-07"] }
mu_tubo = { regra = "viscosidade_fase", corrente = "C-06", fase = "liquido", continua = "oleo", t = ["C-06", "C-07"] }
m_casco = { regra = "vazao_massica", corrente = "C-22" }
cp_casco = { regra = "cp_corrente", corrente = "C-22" }
t_casco_in = { regra = "temperatura", corrente = "C-22" }
mu_casco = { regra = "viscosidade_fase", corrente = "C-22", fase = "liquido", continua = "oleo", t = ["C-22", "C-23"] }

[inativo_se]
carga_nula = "Q_pre"

[recomendadas.banda_caso_projeto]
valor = 1.0
fonte = "P-45 (decisão do usuário, 2026-09-26; específica de trocadores): teto de velocidade em todos os casos; banda inteira no caso de projeto (maior vazão volumétrica no tubo); abaixo do piso no turndown, alerta de operabilidade/incrustação; Dittus-Boelter exigido na faixa em cada caso"

[recomendadas.pelicula_baixo_re]
valor = 1.0
fonte = "Branan (2012), cap. 2, pp. 40-41: a película do lado tubo tem correlação declarada nos três regimes — Hausen (eq. 2-10) em Re ≤ 2000, interpolação (eq. 2-12) em 2000 < Re < 10⁴ e Dittus-Boelter (Saari eq. 6.23) em Re ≥ 10⁴. Este TAG opera em baixa carga fora da faixa turbulenta, e sem os três regimes os casos de turndown eram RECUSADOS por falta de correlação, não por limite físico (docs/validacao/24-pelicula-baixo-reynolds.md)"
