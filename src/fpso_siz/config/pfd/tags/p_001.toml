fonte = "BOT 2.7.1.11: reserva INSTALADA para o pré-aquecedor (minimo_exigido do eixo standby em config/pfd/layout_trocador.toml, com que a busca discreta escolheu esta geometria). Um trem igual aos quatro de operação, sem carga em operação: conta na área instalada, não na de operação"

[recomendadas.cascos_serie]
valor = 8.0
fonte = "melhor candidato da busca discreta de layout (tools/buscar_layout_trocador.py; eixos, regra de seleção e limite de acervo em config/pfd/layout_trocador.toml; frente de Pareto, alternativas e tabela dos 16 casos em docs/validacao/43-design-rating-multiplicidade.md). Avaliado pelo caminho produtivo inteiro: DESIGN no caso de projeto, RATING nos 16 casos com as propriedades reavaliadas no ponto fixo, e o conjunto integrado (P-002 e P-003 pelas cargas residuais, temperaturas finais da ET) verificado. Oito cascos iguais em série por trem: o caminho de tubo que a troca exige (47,8 m) dividido pelo comprimento de estoque (6 m). Cascos em série somam U·A e dividem o comprimento por casco; o fator F do conjunto é o calculado com as temperaturas terminais, o que é conservador."
