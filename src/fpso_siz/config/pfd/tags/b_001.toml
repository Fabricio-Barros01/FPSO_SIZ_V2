# B-001 — Bomba de transferência de óleo. Sucção C-21 (saída do TO-002), recalque C-22 (topologia do balanço).
# Pressão de sucção = P do vaso a montante; pressão de recalque = P da corrente de descarga
# (premissas de pressão do balanço). O líquido sai do vaso no ponto de bolha: Pv = P do vaso
# (Branan, Ex. 5-2). Líquido como fase única, com a fase contínua "oleo".
tag = "B-001"
nome = "Bomba de transferência de óleo"
equipamento = "pump"
metodo = "moran"
bloco = "B-001"
condicao = "C-21"

[servico]
status = "lacuna"
fonte = "Curva, vazão mínima, NPSHr e filosofia duty/standby ausentes no acervo"

[entradas]
q_oil = { regra = "vazao_fase", corrente = "C-21", fase = "liquido" }
rho_oil = { regra = "densidade_fase", corrente = "C-21", fase = "liquido" }
mu_oil = { regra = "viscosidade_fase", corrente = "C-21", fase = "liquido", continua = "oleo" }
pressure = { regra = "pressao", corrente = "C-21" }
temperature = { regra = "temperatura", corrente = "C-21" }
p_recalque = { regra = "pressao", corrente = "C-22" }
pv_informada = { regra = "pressao_vapor_saturado", corrente = "C-21" }
rendimento = { regra = "premissa", nome = "eta_pump" }

[inativo_se]
vazao_nula = "q_oil"

[recomendadas.piso_caso_projeto]
valor = 1.0
fonte = "P-44 (aprovada pelo usuário, 2026-09-26): a linha é dimensionada pelo caso de maior vazão; o piso de velocidade vale só nele e os casos de menor vazão operam abaixo dele (turndown); o teto vale em todos"

[recomendadas.v_min]
valor = 0.0
fonte = "P-44: óleo tratado, líquido limpo. Moran (2016) dá o piso de 1 m/s só para 'water-like fluids with settleable solids'; para líquido limpo o artigo só impõe o teto (nota do descritor v_min)"

[recomendadas.transicao_turndown]
valor = 1.0
fonte = "P-44b — política conservadora de engenharia para a região de transição, separada das correlações fisicamente válidas (a confirmar): na zona de transição laminar-turbulento (Re entre 2.300 e 4.000) nenhuma correlação desta implementação é válida (Moran 2016 declara Colebrook-White só para Re > 4000). Nos casos de turndown, o fator avaliado por Colebrook-White é aceito como estimativa conservadora quando não é menor que 64/Re no mesmo Re; não é correlação válida nem limite superior demonstrado. O caso de projeto segue exigindo correlação válida"
