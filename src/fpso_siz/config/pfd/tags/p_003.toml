# P-003 — Resfriador de óleo. Premissa de projeto P-46 (decisão do usuário em 2026-09-26; específica do
# P-002 e do P-003, não regra geral de trocadores): o óleo (C-23 → C-24), o fluido mais
# viscoso, vai no CASCO, onde Bell-Delaware cobre o escoamento laminar (fator Jr, Branan
# Eq. 2-29), e a água de resfriamento (meio de resfriamento) — água pura de circuito fechado (BOT 3.3.2: 'A closed freshwater cooling system shall be provided to supply cooling medium') — vai nos TUBOS,
# turbulenta (Dittus-Boelter). Estudo que a motivou: F13.2 (docs/validacao/14-alarmes.md).
# A alocação do PFD F1 do Julia (óleo no tubo) está em variantes/p_003_oleo_tubo.toml e é a
# usada no modo de paridade (topologia_julia). As temperaturas da utilidade são insumos; com
# elas a vazão da utilidade fecha a carga Q_C do balanço, ṁ = q/(cp·ΔT), e as propriedades
# da água saem da IAPWS na temperatura média.
tag = "P-003"
nome = "Resfriador de óleo"
topologia_julia = "p_003_oleo_tubo"
equipamento = "exchanger"
metodo = "saari_lmtd"
bloco = "P-003"

[entradas]
m_tubo = { regra = "vazao_utilidade", carga = "Q_C", entrada = "t_agua_in", saida = "t_agua_out", processo = ["C-23", "C-24"] }
cp_tubo = { regra = "cp_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
t_tubo_in = { regra = "insumo", chave = "t_agua_in" }
t_tubo_out = { regra = "insumo", chave = "t_agua_out" }
rho_tubo = { regra = "densidade_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
mu_tubo = { regra = "viscosidade_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
k_tubo = { regra = "condutividade_utilidade", entrada = "t_agua_in", saida = "t_agua_out" }
m_casco = { regra = "vazao_massica", corrente = "C-23" }
cp_casco = { regra = "cp_corrente", corrente = "C-23" }
t_casco_in = { regra = "temperatura", corrente = "C-23" }
mu_casco = { regra = "viscosidade_fase", corrente = "C-23", fase = "liquido", continua = "oleo", t = ["C-23", "C-24"] }

[insumos.t_agua_in]
rotulo = "Temperatura de entrada da água de resfriamento (meio de resfriamento)"
unidade = "°C"
dica = "Temperatura de suprimento da utilidade: dado do sistema de utilidades, sem fonte no acervo."

[insumos.t_agua_out]
rotulo = "Temperatura de saída da água de resfriamento (meio de resfriamento)"
unidade = "°C"
dica = "Temperatura de retorno da utilidade."

[inativo_se]
carga_nula = "Q_C"

[recomendadas.banda_caso_projeto]
valor = 1.0
fonte = "P-45 (decisão do usuário, 2026-09-26; específica de trocadores): teto de velocidade em todos os casos; banda inteira no caso de projeto (maior vazão volumétrica no tubo); abaixo do piso no turndown, alerta de operabilidade/incrustação; Dittus-Boelter exigido na faixa em cada caso"

[recomendadas.d_externo]
valor = 12.7
fonte = "melhor candidato da reotimização discreta reexecutada com a película do lado tubo nos três regimes (tools/reotimizar_trocadores.py; docs/validacao/18-trocadores.md e 24-pelicula-baixo-reynolds.md), dentro da faixa da fonte do descritor (config/pfd/reotimizacao.toml)"

[recomendadas.passes_tubo]
valor = 1.0
fonte = "melhor candidato da reotimização discreta reexecutada com a película do lado tubo nos três regimes (tools/reotimizar_trocadores.py; docs/validacao/18-trocadores.md e 24-pelicula-baixo-reynolds.md), dentro da faixa da fonte do descritor (config/pfd/reotimizacao.toml)"

[recomendadas.razao_passo]
valor = 1.25
fonte = "melhor candidato da reotimização discreta reexecutada com a película do lado tubo nos três regimes (tools/reotimizar_trocadores.py; docs/validacao/18-trocadores.md e 24-pelicula-baixo-reynolds.md), dentro da faixa da fonte do descritor (config/pfd/reotimizacao.toml)"

[recomendadas.layout_tubos]
valor = 30.0
fonte = "melhor candidato da reotimização discreta reexecutada com a película do lado tubo nos três regimes (tools/reotimizar_trocadores.py; docs/validacao/18-trocadores.md e 24-pelicula-baixo-reynolds.md), dentro da faixa da fonte do descritor (config/pfd/reotimizacao.toml)"

[recomendadas.espacamento_chicana]
valor = 0.2
fonte = "melhor candidato da reotimização discreta reexecutada com a película do lado tubo nos três regimes (tools/reotimizar_trocadores.py; docs/validacao/18-trocadores.md e 24-pelicula-baixo-reynolds.md), dentro da faixa da fonte do descritor (config/pfd/reotimizacao.toml)"

[recomendadas.pelicula_baixo_re]
valor = 1.0
fonte = "Branan (2012), cap. 2, pp. 40-41: a película do lado tubo tem correlação declarada nos três regimes — Hausen (eq. 2-10) em Re ≤ 2000, interpolação (eq. 2-12) em 2000 < Re < 10⁴ e Dittus-Boelter (Saari eq. 6.23) em Re ≥ 10⁴. Este TAG opera em baixa carga fora da faixa turbulenta, e sem os três regimes os casos de turndown eram RECUSADOS por falta de correlação, não por limite físico (docs/validacao/24-pelicula-baixo-reynolds.md)"
