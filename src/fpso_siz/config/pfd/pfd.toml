# Integração balanço → equipamentos (F10b): definições comuns aos TAGs de config/pfd/tags/.
#
# Cada entrada de um método de dimensionamento, em cada caso, sai de UMA origem, nesta ordem:
#   automático: usuário (arquivo de ajustes) > regra do TAG ([entradas]) > recomendada do TAG
#               (com fonte) > default do método com fonte (metodos.toml) > LACUNA;
#   manual:     usuário > arquivo importado > recomendada do TAG > default com fonte > LACUNA.
# Lacuna é NaN: o TAG fica "aguardando entrada" e não é dimensionado (regra das fontes —
# docs/decisoes/0002-pfd-automatico.md: sem fonte citável não se supõe valor).

# nome do caso no envelope: único, como no PFD F1 do Julia ("BOT 01 — Early Life")
nome_caso = "BOT {num:02d} — {nome}"

# Limitações da modelagem adicional (não alteram o balanço preliminar). A do óleo depende do
# modo da viscosidade (padrão: óleo vivo; --oleo-morto: só o óleo morto do BOT).
limitacao_oleo.vivo = "Óleo vivo: μ de Beggs & Robinson (1975) sobre o óleo morto do BOT, com o Rs (Q_G/Q_O padrão) do balanço (Standing); correlação fora do acervo local, sem PVT medido; sem Bo; densidade padrão do balanço."
limitacao_oleo.morto = "Óleo morto: sem correção de óleo vivo nem Bo; densidade padrão do balanço."
limitacoes = [
    "Volume do líquido: óleo + fase aquosa; volume do gás dissolvido não modelado.",
    "Utilidades: água pura como líquido saturado na temperatura média; pressão do circuito não informada.",
    "Defaults de geometria e recomendações com fonte devem ser revisados no projeto.",
]

# fases líquidas como grupos de componentes do balanço (O, W, D, G). A fase aquosa é UMA
# solução de NaCl com o sal de cada água ([sal]); o líquido é óleo + fase aquosa, com volumes
# aditivos (fases imiscíveis). O gás dissolvido entra na massa das correntes, não no volume
# do líquido (sem Bo no acervo).
[fases]
oleo = ["O"]
agua = ["W", "D"]
liquido = ["oleo", "agua"]

# salinidade (mg/L) e massa específica padrão de cada água: premissas do balanço
[sal]
W = ["S_W", "rho_W"]
D = ["S_D", "rho_D"]

# mensagens de estado produzidas pelo serviço por TAG
[mensagens]
conta_impossivel = "Cálculo impossível com as entradas informadas ({erro}); reveja os valores fora da faixa do descritor."

# rótulos das origens (JSON, terminal e MC)
[origens]
balanco = "balanço"
propriedade = "propriedade"
premissa = "premissa do balanço"
recomendada = "recomendada"
metodo = "método"
usuario = "usuário"
arquivo = "arquivo"
lacuna = "lacuna"
nao_aplicavel = "não aplicável"
proposta = "proposta do usuário (a confirmar)"
ausente = "instância não descrita pelo caso"

# Faixas de apresentação DO PFD: não mudam o método nem suas fixtures Julia.
# ρ_W = 1154 kg/m³ (P-08); 1500 inclui as salmouras da correlação Laliberté.
[faixas.stewart_arnold.rho_water]
max = 1500.0
fonte = "PFD: faixa ampliada para salmoura (P-08 e Laliberté 2009); não é uma propriedade suposta."
[faixas.arnold_electrostatic.rho_water]
max = 1500.0
fonte = "PFD: faixa ampliada para salmoura (P-08 e Laliberté 2009); não é uma propriedade suposta."
[faixas.moran.rho_oil]
max = 1500.0
fonte = "PFD: líquido bombeado pode ser água produzida (P-08 e Laliberté 2009)."
[faixas.stewart_arnold_2f.rho_oil]
max = 1500.0
fonte = "PFD: fase líquida pode conter salmoura (P-08 e Laliberté 2009)."
