# ---------------------------------------------------------------------------
# Constantes das correlações.
# ---------------------------------------------------------------------------
[constants]

# Eq. (6.23), Dittus-Boelter na forma que Saari publica: coeficiente E expoente de
# Prandtl diferentes para aquecimento e resfriamento. A maioria dos textos traz 0,023
# com os mesmos expoentes; segue-se a fonte. Válida em 10⁴ < Re < 1,2×10⁵ e
# 0,7 < Pr < 120, com erro de -26…+7 % para água — o próprio §6.3.1 a declara adequada
# só a estimativas iniciais, o que é exatamente o estágio deste programa.
dittus_boelter_heating    = 0.024
dittus_boelter_pr_heating = 0.4
dittus_boelter_cooling    = 0.026
dittus_boelter_pr_cooling = 0.3

# FAIXA DE VALIDADE, e o que o programa faz com ela.
#
# Saari (p. 68) declara, logo abaixo da Eq. (6.23): "Equation (6.23) is valid within
# 10^4 < Re < 1.2*10^5 and 0.7 < Pr < 120", e o período seguinte é explícito sobre o que
# há fora: "Below Re = 10^4 the results are much worse."
#
# Fora dessas quatro fronteiras o feixe é RECUSADO, não extrapolado. Um ponto fora do
# domínio de validade não é necessariamente impossível — é um ponto que o modelo
# implementado não está autorizado a avaliar, e h_i atravessa U -> A -> L, de modo que
# aceitá-lo devolveria um comprimento de tubo que nenhuma correlação daqui sustenta.
# Ver `case_admissible` em src/sizing/exchanger/shell_and_tube.jl.
#
# Estão aqui, e não no código, porque são PREMISSA REVISÁVEL declarada pela fonte — a
# mesma regra que põe as fronteiras de regime da bomba no TOML dela. O teto (1,2e5) é a
# metade mais discutível das quatro: a literatura usa Dittus-Boelter bem acima dele, e
# 1,2e5 é o limite que ESTA fonte declara, não um limite físico. Quem tiver base para
# outro valor troca a linha.
#
# Erro DENTRO da faixa, pela própria fonte: -26...+7 % para água, +10...+33 % para ar
# (Pr = 0,7) e -39...+21 % para óleos (Pr = 120). Daí o §6.3.1 concluir que a correlação
# serve "only for rough initial estimates but not accurate sizing calculations" — que é
# exatamente o estágio deste programa.
dittus_boelter_re_min = 1.0e4
dittus_boelter_re_max = 1.2e5
dittus_boelter_pr_min = 0.7
dittus_boelter_pr_max = 120.0

# ---------------------------------------------------------------------------
# BELL-DELAWARE — o coeficiente do lado do casco, calculado
# ---------------------------------------------------------------------------
# Saari descreve o método e não o fecha em fórmula; até aqui `h_casco` era ENTRADA do
# usuário, e como ele domina U (1/500 contra ~1,5e-4 do tubo) o número que mais pesava
# no resultado era um chute. Quem fecha é Branan, cap. 2, Eq. 2-18 a 2-29 e Tabelas
# 2-5/2-6/2-7 — que também confirma, independentemente, o U da Eq. 5.7a de Saari
# (Branan Eq. 2-31) e a área de feixe (√3/2)·passo² (Branan Eq. 2-13).
#
# QUATRO DIVERGÊNCIAS ENCONTRADAS AO REPRODUZIR A FONTE. Todas checáveis por dentro:
#
# 1. Eq. 2-21 imprime  J_ideal = a1·(1,33/(PR/d_o))^a·Re^a2 , com PR definido três
#    páginas antes como "the pitch ratio" (p_t = PR·d_o), ou seja ADIMENSIONAL.
#    "PR/d_o" tem dimensão de 1/comprimento: o valor de J_ideal passaria a depender de
#    d_o estar em mm ou em m, e um coeficiente que muda com a unidade escolhida não é
#    correlação. A forma de Bejan & Kraus [1], que a própria Eq. 2-21 cita, é
#    1,33/(p_t/d_o) = 1,33/PR. É o que se usa.
#
# 2. Tabela 2-5, linha 90° / Re 0-10: o a2 sai impresso "0.667", SEM o sinal de menos
#    que todas as outras 19 linhas trazem. j tem de CAIR com Re (é o que as outras
#    quatro faixas do mesmo layout fazem, e as vinte dos outros três). a2 = -0,667.
#
# 3. Eq. 2-26 imprime θ2 = arccos(1 - 2·lc/Ds) para a área bruta da janela
#    A_wg = (Ds²/8)(θ2 - sen θ2). Com o corte usual de 25 % isso dá 0,0227·Ds² contra
#    os 0,1535·Ds² da área exata do segmento circular — 6,8× menos. Com
#    θ2 = 2·arccos(1 - 2·lc/Ds) o resultado bate a área exata em TODA a faixa de corte,
#    à precisão de máquina (ver test/golden_saari.jl, que confere contra a geometria de
#    `_segment_area`, que o projeto já tinha). Falta o fator 2.
#
# 4. A Eq. 2-24, ao contrário, está certa como impressa: θ1 = arccos(1 - 2·lc/Ds) ali é
#    MEIO ângulo de propósito, e ½(π - θ1)·Ds·d_sb reproduz o (2π - θ_janela)/4·Ds·d_sb
#    da forma padrão. As duas usam o mesmo símbolo com convenções diferentes, que é
#    provavelmente o que produziu o item 3.
#
# 5. Eq. 2-23 imprime  Jl = 0,44(1 - ra) + [1 - 0,044(1 - ra)]·exp(-2,2·rb) — com
#    0,044 no SEGUNDO colchete e 0,44 no primeiro. Encontrada na fase de validação
#    física; checável por dentro, como as três primeiras.
#
#    Jl é um fator que DESCONTA: com vazamento nulo (rb -> 0) ele tem de valer 1,
#    porque não há o que descontar. Com 0,44 nos dois lugares e ra -> 1 dá
#    0,44 + (1 - 0,44) = 1,000 exato. Com o 0,044 impresso daria 0,44 + 0,956 = 1,396 —
#    um "fator de correção" que AUMENTA h_o em 40 % justamente no caso em que a
#    construção é perfeita. É impossível, e 0,44 nos dois lugares é também a forma de
#    Taborek e de Shah & Sekulic. Usa-se 0,44; o `jl_a` abaixo entra nos dois pontos.

[constants.bell_delaware]

# Liga o cálculo. Com `false`, `h_casco` volta a ser o valor informado no formulário —
# é o caminho para quem não conhece a geometria de chicana, e é o que preserva o
# caso-ouro do Exemplo 4.1, que tem U dado.
ativo = true

# Laço interno: h_o depende de Js, Js depende do nº de chicanas, o nº de chicanas
# depende do comprimento de tubo — que é justamente o que a varredura devolve. Ponto
# fixo em L. Converge em poucas passagens porque Js ∈ [0,85 , 1].
tolerancia = 1.0e-9
max_iter   = 60

# Regra de bolso do próprio Branan para geometria desconhecida: "a total correction of
# 0.60 may be used (h_o = 0.6·h_ideal) since this has long been used as a rule of
# thumb". NÃO é usada no caminho normal — fica registrada como piso de comparação.
correcao_de_bolso = 0.60

# Tabela 2-6 — p_n (pitch normal ao escoamento) e p_p (paralelo), em múltiplos de p_t.
# 30°: p_n = p_t,      p_p = (√3/2)·p_t
# 45°: p_n = √2·p_t,   p_p = p_t/√2
# 60°: p_n = √3·p_t,   p_p = p_t/2
# 90°: p_n = p_t,      p_p = p_t
layouts    = [30, 45, 60, 90]
