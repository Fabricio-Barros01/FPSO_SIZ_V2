pp_sobre_pt = [0.8660254037844386, 0.7071067811865475, 0.5, 1.0]

# Eq. (2-13) e (2-14) — área da célula que cada tubo ocupa no campo tubular, em
# múltiplos de p_t². É o que fixa o diâmetro do feixe: D_otl = √(4·N·A_célula/π).
#
#     Area_1tubo,triangular = (√3/2)·(PR·d_o)²      (2-13)   -> 30° e 60°
#     Area_1tubo,quadrada   = (PR·d_o)²             (2-14)   -> 45° e 90°
#
# Branan publica as duas lado a lado e explica cada uma em prosa: "For triangular pitch,
# draw the equilateral triangle with vertices at the center of three tubes. The area of
# the triangle is one-half of the area required to accommodate one tube. Similarly, for
# square pitch draw the square with corners at the center of four tubes. The area of the
# square is equal to the area required to accommodate one tube." A Tabela 2-6 nomeia os
# quatro layouts, e são ELAS que dizem quem é triangular e quem é quadrado: "30°
# Triangular Staggered", "60° Rotated Triangular Staggered", "90° Square Inline",
# "45° Rotated Square Staggered".
#
# Até a fase de validação física o código usava a (2-13) nos QUATRO layouts, o que
# subestimava o feixe de um passo quadrado em 7,5 % (= √(2/√3) − 1) e propagava para D_s,
# a área de escoamento cruzado, o Reynolds do casco e os cinco fatores J. O default
# (30°) não é afetado. Ver test/golden_saari.jl e docs/validacao/02-*.md, defeito 4.
area_celula_sobre_pt2 = [0.8660254037844386, 1.0, 0.8660254037844386, 1.0]

# Limiar de p_t/d_o abaixo do qual a área de escoamento cruzado (A_s) usa a diagonal em
