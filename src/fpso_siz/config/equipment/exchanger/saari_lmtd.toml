label = "Saari (LUT) — LMTD com fator F, casco-e-tubos"
equipment = "exchanger"
reference = "Saari, J., \"Heat Exchanger Dimensioning\", Lappeenranta University of Technology, cap. 3-6 (Algoritmo 4.1, Eq. 4.4-4.9, 5.7a, 6.23; Tabelas 3.1, 4.1). Coeficiente do lado do casco por Bell-Delaware: Branan, C. R., \"Rules of Thumb for Chemical Engineers\", 5. ed., Elsevier, 2012, cap. 2 (Eq. 2-13, 2-18 a 2-31; Tabelas 2-5, 2-6, 2-7). Estrutura conferida contra Toledo-Velazquez, M. et al. (2014), \"Delaware Method Improvement for the Shell and Tubes Heat Exchanger Design\", Engineering 6, 193-201."

# Trocador casco-e-tubos, um passe no casco, contracorrente.
#
# O eixo varrido é o NÚMERO DE TUBOS POR PASSE. Ele fixa a velocidade no tubo, e a
# velocidade fixa o coeficiente interno pela correlação de Dittus-Boelter — que é o que
# faz a varredura ter conteúdo em vez de ser a hipérbole L = A/(N·π·d_o).
#
# BURACO DECLARADO: Saari é texto de aula e não traz um exemplo numérico do trocador
# casco-e-tubos completo. O que ele traz é o Exemplo 4.1 (tubo duplo, com U DADO), que o
# caso-ouro reproduz equação por equação, e a afirmação do §4.1 de que LMTD e ε-NTU são
# exatamente equivalentes, que o caso-ouro usa como conferência cruzada. Um exemplo de
# literatura com o laço de U fechado fecharia o buraco.
#
# A ANÁLISE PINCH NÃO ESTÁ AQUI, e a razão mudou. Enquanto References/ não tinha
# Linnhoff nem Kemp, a razão era falta de fonte. Kemp está lá desde então, e a análise
# existe: config/equipment/pinch/kemp.toml, com o núcleo em src/analysis/pinch.jl.
#
# Ela continua não estando AQUI porque são perguntas diferentes. Pinch dá os ALVOS de
# energia de uma REDE de correntes, antes de existir trocador; este arquivo dimensiona
# UM trocador com o serviço já definido. O box "analise-pinch" responde à primeira; este,
# à segunda.
#
# O que continua verdadeiro sem ressalva: dimensionar um trocador com ΔT_min arbitrado,
# sem a análise da rede que o justifique, é dar um número com aparência de otimizado. O
# programa ainda não LIGA as duas telas — o alvo de pinch não alimenta o serviço do
# trocador, e ninguém aqui alega que alimente.

# --- lado do tubo ------------------------------------------------------------

[[parameter]]
key     = "m_tubo"
label   = "Vazão mássica no tubo"
unit    = "kg/s"
default = 20.0
min     = 0.001
max     = 5000.0
note    = "Eq. 4.5. Fixa a capacidade térmica ṁ·cp e, dividida pelo número de tubos, a velocidade que a Tabela 3.1 restringe."

[[parameter]]
key     = "cp_tubo"
label   = "Calor específico no tubo"
unit    = "J/kg·K"
default = 4180.0
min     = 500.0
max     = 20000.0
note    = "Eq. 4.5, avaliado na temperatura média de mistura (Eq. 6.21). 4180 é água líquida; ~2100 para óleo leve."

[[parameter]]
key     = "t_tubo_in"
label   = "Temperatura de entrada no tubo"
unit    = "°C"
default = 25.0
min     = -50.0
max     = 600.0
note    = "Eq. 4.7. Junto com a do casco define qual lado é o quente — não há campo de escolha, e não pode haver: ele poderia contradizer estes números."

[[parameter]]
key     = "t_tubo_out"
label   = "Temperatura de saída no tubo"
unit    = "°C"
default = 40.0
min     = -50.0
max     = 600.0
note    = "Eq. 4.5. É o dado de projeto do serviço; a saída do lado casco NÃO é pedida — ela sai do balanço, e pedi-la deixaria quatro números descreverem três graus de liberdade."

[[parameter]]
key     = "rho_tubo"
label   = "Densidade no tubo"
unit    = "kg/m³"
default = 995.0
min     = 0.05
max     = 2000.0
note    = "Entra na velocidade (ṁ/ρA) e no Reynolds. 995 é água a ~33 °C."

[[parameter]]
key     = "mu_tubo"
label   = "Viscosidade no tubo"
unit    = "cP"
default = 0.75
min     = 0.001
max     = 10000.0
note    = "§6.3: entra no Reynolds e no Prandtl, ambos avaliados na temperatura média de mistura. 0,75 cP é água a ~33 °C."

[[parameter]]
key     = "k_tubo"
label   = "Condutividade do fluido do tubo"
unit    = "W/m·K"
default = 0.62
min     = 0.005
max     = 100.0
note    = "Fecha o Prandtl (cp·µ/k) e converte o Nusselt em coeficiente (h = Nu·k/d_i). 0,62 é água a ~33 °C; ~0,13 para óleo."

# --- lado do casco -----------------------------------------------------------

[[parameter]]
key     = "m_casco"
label   = "Vazão mássica no casco"
unit    = "kg/s"
default = 15.0
min     = 0.001
max     = 5000.0
note    = "Eq. 4.5. Só entra pelo balanço: o coeficiente do casco é informado, não calculado — ver `h_casco`."

[[parameter]]
key     = "cp_casco"
label   = "Calor específico no casco"
unit    = "J/kg·K"
default = 2100.0
min     = 500.0
max     = 20000.0
note    = "Eq. 4.5. 2100 é óleo leve; 4180, água."

[[parameter]]
key     = "t_casco_in"
label   = "Temperatura de entrada no casco"
unit    = "°C"
default = 110.0
min     = -50.0
max     = 800.0
note    = "Eq. 4.7. A de saída é calculada pelo balanço e aparece no memorial."

[[parameter]]
key     = "mu_casco"
label   = "Viscosidade no casco"
unit    = "cP"
default = 3.0
min     = 0.001
max     = 10000.0
note    = "Entra no Reynolds do casco (Branan Eq. 2-20) e no Prandtl do casco (Eq. 2-19). Antes não era pedida porque h_casco era digitado; agora ele é CALCULADO por Bell-Delaware, e sem viscosidade não há nem Reynolds nem Prandtl daquele lado. 3 cP é óleo leve a ~90 °C."

[[parameter]]
key     = "k_casco"
label   = "Condutividade do fluido do casco"
unit    = "W/m·K"
default = 0.13
min     = 0.005
max     = 100.0
note    = "Fecha o Prandtl do casco (cp·µ/k) na Eq. 2-19 de Branan. 0,13 é óleo; 0,62 é água a ~33 °C."

# --- superfície: o que separa os dois --------------------------------------

[[parameter]]
key      = "h_casco"
label    = "Coeficiente de convecção no casco (se Bell-Delaware desligado)"
unit     = "W/m²·K"
default  = 500.0
min      = 5.0
max      = 50000.0
advanced = true
note     = "SÓ é usado com `bell_delaware.ativo = false`. Com Bell-Delaware ligado (o padrão) h_o é CALCULADO pela Eq. 2-18 de Branan a partir da geometria de chicana, e este campo é ignorado. Deixou de ser a maior aproximação do box por isso. ATENÇÃO ao arbitrar um valor aqui: as Tabelas 4.1 e 4.2 de Saari tabelam o COEFICIENTE GLOBAL U, não o coeficiente de película h_o, e as duas grandezas não são intercambiáveis — como 1/U = 1/h_o + (resistências de parede, incrustação e lado do tubo), h_o é sempre MAIOR que U, tipicamente por um fator de 2 a 4. Pôr aqui um U tabelado subestima h_o e infla a área. Saari não publica tabela de h por serviço; use um h_o de handbook (Perry, TEMA) ou deixe Bell-Delaware calcular."

# --- geometria de chicana: o que Bell-Delaware precisa saber -----------------
# Nenhum destes existia antes, porque h_casco era digitado. São o preço de calcular o
# coeficiente do casco em vez de arbitrá-lo — e o preço é honesto: cada um deles é uma
# decisão de projeto que o trocador real tem de tomar de qualquer jeito.

[[parameter]]
key      = "corte_chicana"
label    = "Corte da chicana / diâmetro do casco"
unit     = "–"
default  = 0.25
min      = 0.15
max      = 0.45
advanced = true
note     = "lc/Ds, a altura da janela. Entra em Jc (Eq. 2-22), nas áreas de vazamento (Eq. 2-24 a 2-26) e no número de fileiras cruzadas. Branan: Jc vai de ~0,53 num corte grande a ~1,15 numa janela pequena — mais de 2× entre os extremos, e é o fator mais sensível ao que se põe aqui. 20-25 % é a prática usual."

[[parameter]]
key      = "espacamento_chicana"
label    = "Espaçamento de chicana / diâmetro do casco"
unit     = "–"
default  = 0.40
min      = 0.20
max      = 1.00
advanced = true
note     = "Lbc/Ds. Entra na área de escoamento cruzado (Eq. 2-19) e, por ela, no Reynolds do casco. TEMA limita a 1/5 do diâmetro por baixo (vibração) e ao diâmetro por cima. Chicana mais apertada NÃO é sempre melhor: aumenta a fração da vazão que vaza em vez de cruzar o feixe, e Jl cai."

[[parameter]]
key      = "layout_tubos"
label    = "Arranjo do feixe"
unit     = "°"
default  = 30.0
min      = 30.0
max      = 90.0
advanced = true
note     = "30 (triangular), 45 (quadrado rotacionado), 60 (triangular rotacionado) ou 90 (quadrado alinhado) — os quatro da Tabela 2-6 de Branan. Define pn e pp, e a faixa de coeficientes da Tabela 2-5. 30° é o mais compacto e o padrão em serviço limpo; 90° é o que permite limpeza mecânica externa. Arredondado para o mais próximo dos quatro."

[[parameter]]
key      = "pares_veda"
label    = "Pares de faixas de vedação"
unit     = "–"
default  = 1.0
min      = 0.0
max      = 20.0
advanced = true
note     = "nss, na Eq. 2-27. Bloqueiam o desvio pelo vão entre feixe e casco. Branan: um par a cada seis fileiras de tubo é a regra de bolso; a API 660 pede dispositivo a cada 5-7 passos de tubo, o que dá z ≈ 0,17. Com z ≥ 0,5 o desvio é considerado totalmente bloqueado e Jb = 1."

[[parameter]]
key      = "folga_furo_chicana"
label    = "Folga furo da chicana − diâmetro do tubo"
unit     = "mm"
default  = 0.8
min      = 0.0
max      = 3.0
advanced = true
note     = "dtb, na Eq. 2-25. Branan: 0,8 mm (1/32 in) é o usual, redutível a 0,4 mm (1/64 in) para diminuir o vazamento tubo-chicana. Entra em Jl."

[[parameter]]
key      = "faixas_divisoras"
label    = "Faixas divisoras de passe paralelas ao escoamento"
unit     = "–"
default  = 0.0
min      = 0.0
max      = 8.0
advanced = true
note     = "ndp, na Eq. 2-27 (Abp). São as canaletas abertas no feixe pelas chapas divisórias de passe, quando ORIENTADAS na direção do escoamento no casco — só elas contribuem para o desvio. Zero quando a divisória é perpendicular, que é o arranjo usual de 2 passes. A largura assumida é 2× o diâmetro do tubo, como Branan indica quando ela é desconhecida."

[[parameter]]
key     = "d_externo"
label   = "Diâmetro externo do tubo"
unit    = "mm"
default = 19.05
min     = 5.0
max     = 55.0
note    = "Tabela 3.1: tubos padronizados de 5 a 55 mm, tipicamente 12,7 a 25,4 mm. 19,05 mm é o 3/4 in, o mais comum em serviço de processo. É a área externa que define U (§5.1: usa-se a maior)."

[[parameter]]
key     = "espessura"
label   = "Espessura da parede do tubo"
unit    = "mm"
default = 2.11
min     = 0.3
max     = 10.0
note    = "d_i = d_o − 2·espessura. 2,11 mm é o BWG 14, bitola usual em aço-carbono. Entra na resistência de parede (Eq. 5.4) e na seção livre."

[[parameter]]
key      = "k_parede"
label    = "Condutividade da parede"
unit     = "W/m·K"
default  = 50.0
min      = 1.0
max      = 500.0
advanced = true
note     = "Eq. 5.4. 50 para aço-carbono, ~16 para inox 316, ~110 para latão, ~390 para cobre. Costuma ser a menor das cinco resistências — e é a única que não se pode melhorar sem trocar de material."

[[parameter]]
key      = "rf_tubo"
label    = "Incrustação no lado tubo"
unit     = "m²·K/W"
default  = 0.00018
min      = 0.0
max      = 0.01
advanced = true
note     = "Cap. 8: R\"f tabelado por serviço, não calculado por espessura — \"rarely known precisely enough\". 0,00018 é água de resfriamento tratada; água bruta chega a 0,0005."

[[parameter]]
key      = "rf_casco"
label    = "Incrustação no lado casco"
unit     = "m²·K/W"
default  = 0.00035
min      = 0.0
max      = 0.01
advanced = true
note     = "Cap. 8. 0,00035 é óleo leve; hidrocarboneto pesado passa de 0,0009. Somada à do tubo, costuma ser a segunda maior resistência do conjunto."

[[parameter]]
key      = "razao_passo"
label    = "Passo do feixe / diâmetro do tubo"
unit     = "–"
default  = 1.25
min      = 1.1
max      = 2.0
advanced = true
note     = "Tabela 3.1: 1,25 a 1,5 vezes d_o. Mais apertado não dá rigidez ao espelho; mais folgado infla o casco e piora a troca. Define o diâmetro do feixe, e por ele o teto de casco."

[[parameter]]
key      = "passes_tubo"
label    = "Passes no lado tubo"
unit     = "–"
default  = 2.0
min      = 1.0
max      = 2.0
advanced = true
note     = "1 = contracorrente puro, F = 1 (§4.2.1). 2 = arranjo TEMA E parcialmente paralelo, com F da Fig. 4.3. Arredondado para o inteiro mais próximo: só estes dois têm fórmula em Saari."

