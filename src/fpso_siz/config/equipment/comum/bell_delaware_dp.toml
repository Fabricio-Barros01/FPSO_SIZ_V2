# Perda de carga do lado CASCO por Bell-Delaware — Branan (2012), pp. 46-47, Eq. 2-32 a 2-38, e os
# coeficientes b da Tabela 2-5 (p. 42). Extensão do V2 (Fase C, docs/validacao/46): fica FORA de
# [constants.bell_delaware] do método porque aquelas são as constantes do port do Julia, conferidas
# contra a fixture; os layouts e as faixas de Re da Tabela 2-5 continuam lá e são os mesmos.
fonte = "Branan, C. R., Rules of Thumb for Chemical Engineers, 5. ed., Elsevier, 2012, cap. 2, pp. 42 e 46-47 (Eq. 2-32 a 2-38; Tabela 2-5)"

# Conferido contra a página RENDERIZADA (o texto extraído do PDF perde os sinais de menos).
# DIVERGÊNCIAS, todas checáveis por dentro, numeradas na sequência das 1 a 5 do coeficiente de troca
# (config/equipment/exchanger/saari_lmtd.toml, [constants.bell_delaware]):
#
# 6. Eq. 2-32 imprime f_ideal = b1·(1,33/(PR/d_o))^b·Re^b2 — a mesma forma da Eq. 2-21, com o
#    mesmo defeito de dimensão (divergência 1). Usa-se 1,33/PR.
#
# 7. Eq. 2-33 imprime ΔP_b,ideal = 4·f·Ws²·n_r,cc/(2·ρ·g_c·A_s)·(µ_w/µ)^0,14. Com Ws em kg/s e A_s
#    em m² isso dá N, não Pa: falta o quadrado de A_s (a velocidade mássica Ws/A_s entra ao
#    quadrado, como na forma de Taborek que a própria tabela cita [13]). Usa-se A_s².
#
# 8. Eq. 2-36 imprime ΔP_w,ideal = Ws·(2 + 0,6·n_tw)/(2·g_c·A_s·A_w·ρ): dá Pa·s/m... não é
#    pressão. Falta o quadrado de Ws (Taborek: ṁ²/(S_m·S_w·ρ)). Usa-se Ws². O mesmo vale para o
#    segundo termo da Eq. 2-37 (Re < 100), impresso Ws/(A_s·A_w·ρ); o primeiro termo da 2-37
#    (26·µ·Ws/√(A_s·A_w)/ρ·(…)) já tem dimensão de pressão e é usado como impresso.
#
# 9. Tabela 2-5, layout 90°, Re 10-100: b2 impresso -0,0963. As outras linhas da mesma faixa
#    trazem -0,973 (30° e 60°) e -0,913 (45°), e a CONTINUIDADE de f_ideal com as faixas
#    vizinhas só fecha com -0,963 (35·10^-1 = 3,50 contra 32,1·10^-0,963 = 3,49 em Re = 10; com o
#    impresso, 25,7). Provável erro de impressão — mas, por decisão do usuário (2026-10-02), a
#    faixa fica NÃO VALIDADA até conferência na fonte original: usa-se o valor IMPRESSO e o
#    resultado sai marcado como não validado, sem aprovar nem reprovar nada.
#
# 10. Tabela 2-5, layout 90°, Re 1000-10000: b2 impresso -0,022. A continuidade com as faixas
#    vizinhas só fecha com +0,022 (Re = 10³: 6,09·10³^-0,602 = 0,0957 contra 0,0815·10³^0,022 =
#    0,0950; Re = 10⁴: 0,0998 contra 0,100). Mesma decisão: faixa NÃO VALIDADA, valor impresso.
#
# 11. Eq. 2-36 imprime (2 + 0,6·n_tw), e a lista de símbolos da página usa n_tw para o NÚMERO DE
#    TUBOS na janela (é assim que ele entra em D_w, Eq. 2-37). O 0,6 é perda por FILEIRA de tubos
#    cruzada na janela — o papel que a própria Eq. 2-37 dá a n_r,tw, "rows crossed in the window",
#    definido logo abaixo dela. Com o número de tubos, a ΔP da janela cresceria com o quadrado do
#    diâmetro do feixe para a mesma velocidade, o que não tem sentido físico (no P-001 da ADR 0005:
#    69 tubos contra 5,4 fileiras, 8× na parcela da janela). Usa-se n_r,tw.
#
# O teste de continuidade das 20 linhas está em tests/sizing/test_bell_delaware_dp.py: as
# linhas 9 e 10 são as únicas que o falham.
b1_30 = [48.0, 45.1, 4.57, 0.486, 0.372]
b2_30 = [-1.0, -0.973, -0.476, -0.152, -0.123]
b1_45 = [32.0, 26.2, 3.5, 0.333, 0.303]
b2_45 = [-1.0, -0.913, -0.476, -0.136, -0.126]
b1_60 = [48.0, 45.1, 4.57, 0.486, 0.372]
b2_60 = [-1.0, -0.973, -0.476, -0.152, -0.123]
b1_90 = [35.0, 32.1, 6.09, 0.0815, 0.391]
b2_90 = [-1.0, -0.0963, -0.602, -0.022, -0.148]
# b3 e b4 por layout (as cinco linhas de cada layout repetem o mesmo par)
b3 = [7.0, 6.59, 7.0, 6.3]
b4 = [0.5, 0.52, 0.5, 0.378]
# faixas [layout, índice da faixa de Re] cujo coeficiente fica NÃO VALIDADO (divergências 9 e 10)
b_nao_validado = [[90, 1], [90, 3]]
# Eq. 2-32: b = b3/(1 + coef_b·Re^b4)
coef_b = 0.14
# Eq. 2-34: Rb = exp[−Cbp·rc·(1 − (2ζ)^(1/3))]; Cbp = 4,5 se Re ≤ 100, 3,7 acima; Rb = 1 se ζ ≥ 0,5
rb_c_laminar = 4.5
rb_c_turbulento = 3.7
# Eq. 2-35: Rl = exp[−1,33·(1 + ra)·rb^c], c = −0,15·(1 + ra) + 0,8
rl_a = 1.33
rl_c_a = -0.15
rl_c_b = 0.8
# Eq. 2-36: ΔP_w,ideal = Ws²·(2 + 0,6·n_tw)/(2·A_s·A_w·ρ)  (Re ≥ 100)
dpw_base = 2.0
dpw_coef = 0.6
# Eq. 2-37: ΔP_w,ideal = 26·µ·Ws/√(A_s·A_w)/ρ·(n_r,tw/(p_t − d_o) + L_bc/D_w²) + Ws²/(A_s·A_w·ρ)  (Re < 100)
dpw_laminar_coef = 26.0
dpw_re_corte = 100.0
# n_r,tw = 0,8·[l_c − 0,5·(D_s − D_otl + d_o)]/p_p
nrtw_coef = 0.8
nrtw_meio = 0.5
# Eq. 2-33: ΔP_b,ideal = dpb_coef·f·Ws²·n_r,cc/(2·ρ·A_s²)·(µ_w/µ)^0,14
dpb_coef = 4.0
# Eq. 2-34: Rb = 1 a partir de ζ = 0,5
rb_zeta_max = 0.5
# Eq. 2-37: D_w = dw_coef·A_w/(π·d_o·n_tw + D_s·θ2/2)
dw_coef = 4.0
