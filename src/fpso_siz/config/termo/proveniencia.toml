# Contrato ÚNICO de proveniência de propriedade (invariante 5 do CLAUDE.md).
#
# Dois conceitos independentes, que antes se confundiam num só ("liberada"):
#   validade — a propriedade é utilizável em engenharia? validada | nao_validada | ausente
#   origem   — de que modelo ou dado o valor sai (lista quando a propriedade é composta)
# e um terceiro, que é o que a proveniência precisa dizer de fato:
#   consumidores — quem CONSOME o valor hoje. Lista vazia = diagnóstico: existe, tem validade
#                  declarada, e nenhum cálculo de balanço, dimensionamento ou otimização o usa.
#
# Regra: a proveniência diz o que o cálculo consumiu, nunca o que estaria autorizado a consumir.
# Uma propriedade `nao_validada` ou `ausente` não pode ter consumidor (teste de arquitetura).
#
# `casos` (opcional): a classe de caso em que o consumo acontece —
#   avaliaveis     casos sem gás de lift: recombinação da Nota 4 + trem de flashes (produtivo);
#   nao_avaliaveis casos com gás de lift (9, 11, 15, 16): Standing, sem flash.
# Sem `casos`, o consumo vale em todo caso. O EstadoProcesso de cada caso aponta só para o que
# a SUA classe consumiu (termo/proveniencia.consumidas(..., avaliavel=)).
#
# Ligações com o código, conferidas por teste: `rastro` = equação do rastro do balanço que a
# produz; `regra` = regra de entrada de TAG (pfd/entradas.REGRAS) que a entrega; `funcao` =
# função de termo/servico.py; `fonte` = chaves "seção.campo" de termo/fluidos.toml.

[validade]
validada = "com fonte citável e usada dentro do domínio declarado da correlação ou do dado"
nao_validada = "o backend ou a correlação devolve número, mas fora do domínio conferido ou sem dado que o valide; pode ser exposta com aviso, nunca consumida"
ausente = "não existe e não é estimada: NaN e lacuna declarada"

[origem]
BOT = "dado do BOT I-ET-3010.2K-1200-941-P4X-001 rev. C (composição, API, tabelas de viscosidade, vazões)"
premissa = "premissa declarada em premissas.toml / constantes.toml, com fonte"
Standing = "correlação de Standing para o gás em solução (constantes.toml [standing])"
BeggsRobinson = "Beggs & Robinson (1975), viscosidade de óleo vivo (termo/fluidos.toml [oleo_vivo])"
PengRobinson = "equação de estado de Peng-Robinson (1976) via ChEDL (termo/backend.py)"
Brokaw = "regra de mistura de Brokaw para a viscosidade do gás diluído, via ChEDL"
IAPWS = "IAPWS-95 (ρ, cp), IAPWS 2008 (μ), IAPWS 2011 (k)"
Laliberte = "Laliberté (2009), solução aquosa de NaCl, via ChEDL"
Zanker = "viscosidade de emulsão de Zanker (Branan eq. 27-4)"
RiaziAlSahhaf = "caracterização de pseudo-componentes de Riazi & Al-Sahhaf (1996) (caracterizacao_scn.toml)"

