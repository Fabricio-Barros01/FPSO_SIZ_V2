# ---------------------------------------------------------------------------- trem (produtivo nos casos avaliáveis)
# O trem SG-001 → V-001 → V-002 parte da composição do caso recombinada pela Nota 4 do BOT
# (premissa de modelagem aprovada, docs/validacao/38) e é o que dá o gás de cada estágio nos
# casos sem gás de lift. "validada" aqui é o sentido do contrato: PR com kij do ChemSep e
# caracterização de Riazi & Al-Sahhaf (fontes citadas), com a composição que reproduz as vazões
# do BOT e fechamento de massa, mol e componente. NÃO há PVT medido: a validação é de
# consistência com o BOT, não experimental (docs/validacao/39).
[[propriedade]]
id = "composicao_caso"
rotulo = "composição do caso recombinada (Nota 4)"
unidade = "–"
origem = ["BOT", "premissa", "PengRobinson", "RiaziAlSahhaf"]
validade = "validada"
consumidores = ["balanco"]
rastro = "recombinacao"
funcao = "flash_tp"
casos = "avaliaveis"
nota = "z_caso = (ṅ_g·y_ref + ṅ_L·x_ref)/(ṅ_g + ṅ_L), referência P_FWKO e T do caso; reproduz produced_gas_sm3d no FWKO e oil_sm3d de óleo morto. z_base (BOT) não é alterado"

[[propriedade]]
id = "fracao_vapor_estagio"
rotulo = "fração de vapor β de cada estágio"
unidade = "–"
origem = ["PengRobinson", "RiaziAlSahhaf"]
validade = "validada"
consumidores = ["balanco"]
rastro = "flash_estagio"
funcao = "flash_tp"
casos = "avaliaveis"
nota = "Q_G do estágio = β·ṅ_F·V_M: é a vazão de gás de SG-001, V-001 e V-002 nos casos avaliáveis"

[[propriedade]]
id = "composicao_vapor_estagio"
