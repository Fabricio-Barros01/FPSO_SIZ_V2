validade = "validada"
consumidores = ["balanco"]
rastro = "gas_massa_especifica_std"
nota = "MW do corte leve / V_M, com V_M = R·T_padrão/P_padrão"

[[propriedade]]
id = "cp_gas_balanco"
rotulo = "cp do gás no balanço"
unidade = "kJ/(kg·K)"
origem = ["premissa"]
validade = "validada"
consumidores = ["balanco"]
rastro = "gas_cp"
nota = "cp de gás ideal a 25 °C por componente, média pela composição do corte leve: simplificação declarada do balanço"

[[propriedade]]
id = "massa_especifica_oleo"
rotulo = "massa específica do óleo"
unidade = "kg/m³"
origem = ["BOT"]
validade = "validada"
consumidores = ["balanco", "dimensionamento"]
rastro = "rho_oleo_api"
