unidade = "–"
origem = ["PengRobinson", "RiaziAlSahhaf"]
validade = "validada"
consumidores = ["balanco"]
rastro = "flash_estagio"
funcao = "flash_tp"
casos = "avaliaveis"
nota = "define o MW do vapor (massa do gás de cada estágio); a μ do gás NÃO usa y (sem método validado)"

[[propriedade]]
