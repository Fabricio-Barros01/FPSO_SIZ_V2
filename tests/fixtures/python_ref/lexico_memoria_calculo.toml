# Divergência lexical declarada entre o documento de referência e o que este programa gera.
#
# Decisão do usuário em 2026-09-27: o termo correto é "memória de cálculo", não "memorial de
# cálculo", e a paridade byte a byte do TEXTO com a saída do script de referência
# (`references/Balanço_Preliminar.py`, cujo produto é `main_ref.tex`) fica relaxada NESTE ponto.
#
# O `main_ref.tex` NÃO é editado: ele é o artefato do script de referência, e o hash dele é a
# proveniência do oráculo (tests/balanco/test_oraculo.py, `main_tex_sha256`). Em vez disso, o teste
# de paridade aplica estas substituições ao texto de referência ANTES de comparar. O efeito é
# cirúrgico: só o termo é tolerado, e qualquer outra diferença — um número, uma casa decimal, uma
# vírgula — continua reprovando. A concordância de gênero entra caso a caso, porque "memorial" é
# masculino e "memória" é feminino.
#
# A paridade dos NÚMEROS não foi relaxada: ela é verificada pelo `oraculo_balanco.json`, que não
# tem texto corrido, e pela regressão da regra padrão do FWKO.
#
# `de` = como está no documento de referência; `para` = como este programa escreve.
# Strings literais (aspas simples): o texto tem barras invertidas do LaTeX.

