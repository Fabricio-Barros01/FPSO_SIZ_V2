[project]
name = "fpso-siz"
version = "0.1.0"
description = "Balanço de massa/energia preliminar e dimensionamento de equipamentos de separação e tratamento de óleo de FPSO"
readme = "SPRINTS.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "jinja2>=3.1",  # só na camada de saída (output/latex); o núcleo não importa
    "thermo>=0.6.1,<0.7",
    "chemicals>=1.5.2,<1.6",
]

[project.scripts]
fpso-siz = "fpso_siz.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not latex and not julia'"
markers = ["latex: compila o memorial com latexmk (lento; rode com -m latex)",
           "julia: regenera as fixtures do Julia a partir de um git archive (lento; rode com -m julia)"]

[tool.coverage.run]
source = ["fpso_siz"]
branch = true
omit = ["*/fpso_siz/__main__.py"]  # exercitado por subprocesso em tests/test_cli.py
